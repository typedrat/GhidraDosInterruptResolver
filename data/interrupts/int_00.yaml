file_type: interrupt
key: '00'
entries:
- entry_type: INT
  id: C-00
  category: C
  title: CPU-generated - DIVIDE ERROR
  source: INTERRUP.A:136
  interrupt: '00'
  flags:
  - C
  input_registers: []
  returns: []
  description: 'generated if the divisor of a DIV or IDIV instruction is zero or the

    quotient overflows the result register; DX and AX will be unchanged.'
  notes:
  - 'on an 8086/8088, the return address points to the following instruction

    on an 80286+, the return address points to the divide instruction

    an 8086/8088 will generate this interrupt if the result of a division

    is 80h (byte) or 8000h (word)'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '04'
    params: {}
  - type: opcode
    mnemonic: AAD
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: G-00
  category: G
  title: Zenith - ROM DEBUGGER
  source: INTERRUP.A:145
  interrupt: '00'
  flags: []
  input_registers: []
  returns: []
  description: 'invokes the ROM Debugger when at the BIOS level; equivalent to

    pressing Ctrl-Alt-Ins on booting.'
  notes:
  - 'since DOS revectors INT 00, it is necessary to restore this vector to

    its original ROM BIOS value in order to invoke the debugger once DOS

    loads'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '03'
    params: {}
    name: Columbia
  index: []
  tables: []
  table_refs: []
