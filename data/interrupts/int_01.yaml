- entry_type: INT
  id: C-01
  category: C
  title: CPU-generated (80386+) - DEBUGGING EXCEPTIONS
  source: INTERRUP.A:163
  interrupt: '01'
  flags:
  - C
  input_registers: []
  returns: []
  description: 'generated by the CPU on various occurrences which may be of interest

    to a debugger program'
  notes:
  - 'events which may trigger the interrupt:

    Instruction address breakpoint fault - will return to execute inst

    Data address breakpoint trap - will return to following instruction

    General detect fault, debug registers in use

    Task-switch breakpoint trap

    undocumented 386/486 opcode F1h - will return to following instruc'
  bugs: []
