file_type: interrupt
key: '03'
entries:
- entry_type: INT
  id: C-03
  category: C
  title: CPU-generated - BREAKPOINT
  source: INTERRUP.A:205
  interrupt: '03'
  flags:
  - C
  input_registers: []
  returns: []
  description: generated by the one-byte breakpoint instruction (opcode CCh)
  notes:
  - 'used by debuggers to implement breakpoints, such as MS-DOS DEBUG''s G

    command

    also used by Turbo Pascal versions 1,2,3 when {$U+} specified

    return address points to byte following the breakpoint instruction

    called by Novell DOS 7 EMM386 after displaying an exception error

    message (GPF, illegal opcodes, etc.) and before waiting for user

    input

    called by QEMM-386 if the user presses ''I'' (undocumented) when prompted

    after an exception error message'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '01'
    params: {}
    name: CPU
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: G-03
  category: G
  title: Columbia PCs (desktop,VP portables) - ROM DEBUGGER
  source: INTERRUP.A:218
  interrupt: '03'
  flags: []
  input_registers: []
  returns: []
  description: 'invokes the ROM Debugger if INT 03 has not been revectored; equivalent

    to pressing Esc on booting.'
  notes: []
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '00'
    params: {}
    name: Zenith
  - type: interrupt
    interrupt: '03'
    params: {}
    name: Realia
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: G-03
  category: G
  title: Realia COBOL - DEBUGGER SUPPORT
  source: INTERRUP.A:223
  interrupt: '03'
  flags: []
  input_registers: []
  returns: []
  notes:
  - 'Realia COBOL checks for a signature eight bytes prior to the interrupt

    handler when it starts up'
  bugs:
  - 'if the offset of the INT 03 vector is less than 8, the compiler and

    all executables generated by it will crash the system'
  see_also:
  - type: interrupt
    interrupt: '03'
    params: {}
    name: Columbia
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: G-03
  category: G
  title: Watcom WVIDEO, Watcom WD - OUTPUT DEBUGGING MESSAGE
  source: INTERRUP.A:230
  interrupt: '03'
  flags:
  - U
  input_registers: []
  returns: []
  notes:
  - 'the INT 03h instruction which invokes the debugger must be followed by

    a JMP SHORT and the signature string "WVIDEO"

    to check whether this interface is available, define a public byte

    variable named ___WD_Present, which the debugger will set to 01h

    before running the program'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AX: 0910h
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: U-03
  category: U
  title: DTown Utilities - POP UP
  source: INTERRUP.A:240
  interrupt: '03'
  flags: []
  input_registers: []
  returns: []
  program: 'DTown Software Development''s DTown Utilities contains various tools

    which are useful to programmers, such as a memory viewer and

    disassembler'
  notes:
  - 'DTU pops up on INT 03 (if not hooked by a debugger) to allow the

    user to inspect memory or code when the machine crashes; various

    memory managers will invoke INT 03 when displaying a CPU exception

    error message (either automatically or when the user presses a

    particular key)'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: 2D
    params:
      AL: 20h
    name: DTown
  index: []
  tables: []
  table_refs: []
