entries:
- entry_type: INT
  id: B-05
  category: B
  title: PRINT SCREEN
  source: INTERRUP.A:509
  interrupt: '05'
  flags: []
  input_registers: []
  returns: []
  description: dump the current text screen to the first printer
  notes:
  - 'normally invoked by the INT 09 handler when PrtSc key is pressed, but

    may be invoked directly by applications

    byte at 0050h:0000h contains status used by default handler

    00h not active

    01h PrtSc in progress

    FFh last PrtSc encountered error

    default handler is at F000h:FF54h in IBM PC and 100%-compatible BIOSes

    since the BOUND instruction also calls INT 05h, but returns control

    to the BOUND instruction, a failed BOUND check will cause an infinite

    loop of PrtScreens unless the INT 05 handler is aware of the problem

    and checks whether the interrupt was invoked by a BOUND instruction'
  bugs:
  - some old BIOSes/applications appear to destroy BP on return
  see_also:
  - type: interrupt
    interrupt: '10'
    params:
      AH: 12h
      BL: 20h
  - type: interrupt
    interrupt: 4A
    params: {}
    name: Tandy 2000
  - type: interrupt
    interrupt: 5E
    params: {}
    name: TI Professional
  - type: interrupt
    interrupt: '80'
    params: {}
    name: Phar Lap
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: C-05
  category: C
  title: CPU-generated (80186+) - BOUND RANGE EXCEEDED
  source: INTERRUP.A:526
  interrupt: '05'
  flags:
  - C
  input_registers: []
  returns: []
  description: 'generated by BOUND instruction when the value to be tested is less than

    the indicated lower bound or greater than the indicated upper bound.'
  notes:
  - returning from this interrupt re-executes the failing BOUND instruction
  bugs: []
  see_also: []
  index: []
