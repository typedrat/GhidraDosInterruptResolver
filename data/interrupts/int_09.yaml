- entry_type: INT
  id: C-09
  category: C
  title: CPU-generated (80286,80386) - PROCESSOR EXTENSION PROTECTION ERROR
  source: INTERRUP.A:751
  interrupt: 09
  flags:
  - C
  input_registers: []
  returns: []
  description: 'called if the coprocessor attempts to access memory outside a segment

    boundary; it may occur at an arbitrary time after the coprocessor

    instruction was issued'
  notes:
  - 'until the condition is cleared or the coprocessor is reset, the only

    coprocessor instruction which may be used is FNINIT; WAIT or other

    coprocessor instructions will cause a deadlock because the

    coprocessor is still busy waiting for data

    for the 486+, a coprocessor protection error generates an INT 0D'
  bugs: []
