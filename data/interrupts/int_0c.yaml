- entry_type: INT
  id: C-0C
  category: C
  title: CPU-generated (80286+) - STACK FAULT
  source: INTERRUP.A:855
  interrupt: 0C
  flags:
  - C
  input_registers: []
  returns: []
  description: 'this interrupt is generated in protected mode on a stack overflow or

    underflow, or if an inter-level transition or task switch references

    a stack segment marked "not present"; it is generated in real mode

    on accessing a word operand at SS:FFFFh'
  notes:
  - 'the 80286 will shut down in real mode if SP=1 before a push.  On the

    PC AT and compatibles, external circuitry generates a reset on

    shutdown.'
  bugs: []
  see_also:
