- entry_type: INT
  id: H-0E
  category: H
  title: IRQ6 - DISKETTE CONTROLLER
  source: INTERRUP.A:959
  interrupt: 0E
  flags:
  - C
  input_registers: []
  returns: []
  description: 'this interrupt is generated by the floppy disk controller on

    completion of an operation'
  notes:
  - 'default handler is at F000h:EF57h in IBM PC and 100%-compatible BIOSes

    may be masked by setting bit 6 on I/O port 21h

    DOS 3.3+ revectors IRQ6 to a stack-switching routine unless STACKS=0

    has been set in CONFIG.SYS.  MS/PC-DOS use the IBM Interrupt Sharing

    Protocol (see #02568) when hooking this IRQ'
  bugs: []
