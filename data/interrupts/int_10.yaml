- entry_type: INT
  id: V-10FE
  category: V
  title: TopView - GET SHADOW BUFFER
  source: INTERRUP.B:954
  interrupt: '10'
  flags: []
  function: FE
  input_registers:
  - reg: AH
    operator: '='
    value: FEh
    table_refs: []
    sub_values: []
  - reg: ES:DI
    operator: ->
    description: assumed video buffer
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: ES:DI
      operator: ->
      description: actual video buffer for calling process
      table_refs: []
      sub_values: []
    raw_lines: []
  description: 'Determine the address of the virtual screen to which the program

    should write instead of the actual video memory; this permits

    programs to be multitasked without interfering with each other''s

    output, and allows memory managers to move the video memory to

    permit larger programs to be loaded.'
  notes:
  - 'if no multitasker or RSIS-compliant environment is installed, ES:DI is

    returned unchanged; RSIS is the Relocated Screen Interface

    Specification

    for display pages other than 0, use AH=05h and AH=0Fh to determine

    whether a particular page exists

    TopView requires a call to AH=FFh to notify it that the screen has

    changed; DESQview will check for changes itself until the first call

    to AH=FFh'
  bugs: []
  see_also:
