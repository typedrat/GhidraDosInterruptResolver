- entry_type: INT
  id: V-101110
  category: V
  title: VIDEO - TEXT-MODE CHARGEN - LOAD USER-SPECIFIED PATTERNS (PS,EGA,VGA)
  source: INTERRUP.A:2861
  interrupt: '10'
  flags: []
  function: '1110'
  input_registers:
  - reg: AX
    operator: '='
    value: 1110h
    table_refs: []
    sub_values: []
  - reg: ES:BP
    operator: ->
    description: user table
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: count of patterns to store
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    description: character offset into map 2 block
    table_refs: []
    sub_values: []
  - reg: BL
    operator: '='
    description: block to load in map 2
    table_refs: []
    sub_values: []
  - reg: BH
    operator: '='
    description: number of bytes per character pattern
    table_refs: []
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - nothing
  notes:
  - "This function will cause a mode set, completely resetting\nthe video environment, but without clearing the video buffer\n\
    This function is designed to be called immediately after a mode set,\nit is equivalent to AX=110xh except that:\nPage\
    \ 0 must be active.\nBytes/character is recalculated.\nMax character rows is recalculated.\nCRT buffer length is recalculated.\n\
    CRTC registers are reprogrammed as follows:\nR09 = bytes/char-1 ; max scan line (mode 7 only)\nR0A = bytes/char-2 ; cursor\
    \ start\nR0B = 0\t\t; cursor end\nR12 = ((rows+1)*(bytes/char))-1 ; vertical display end\nR14 = bytes/char\t; underline\
    \ loc\n(*** BUG: should be 1 less ***)\nthe current block specifiers may be determined with INT 10/AH=1Bh,\nlooking at\
    \ offsets 2Bh and 2Ch of the returned data (VGA only)\n(see AH=1Bh,#00040)"
  bugs: []
  see_also:
  - type: interrupt
    params:
      AX: 1100h
  - type: interrupt
    params:
      AX: 1111h
  - type: interrupt
    params:
      AX: 1112h
