  source: INTERRUP.A:8579
  interrupt: '10'
  flags: []
  function: '72'
  input_registers:
  - reg: AH
    operator: '='
    value: 72h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: mechanism to use
    table_refs: []
    sub_values:
    - value: 00h
      description: do not use inverse video
      sub_values: []
    - value: 01h
      description: emulate MDA. Display attribute 07h is normal video and 70h is inverse video.
      sub_values: []
    - value: 02h
      description: use inverse video if background is non-black.
      sub_values: []
    - value: 03h
      description: use inverse video for high intensity text.
      sub_values: []
    - value: 04h
      description: use inverse video for text with background intensity greater than foreground intensity.
      sub_values: []
    - value: 05h
      description: use inverse video for text with background color other than black or high intensity foreground.
      sub_values: []
