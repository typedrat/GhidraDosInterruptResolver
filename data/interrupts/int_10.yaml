- entry_type: INT
  id: V-1008
  category: V
  title: VIDEO - READ CHARACTER AND ATTRIBUTE AT CURSOR POSITION
  source: INTERRUP.A:2238
  interrupt: '10'
  flags: []
  function: 08
  input_registers:
  - reg: AH
    operator: '='
    value: 08h
    table_refs: []
    sub_values: []
