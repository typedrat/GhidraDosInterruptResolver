- entry_type: INT
  id: C-10
  category: C
  title: CPU-generated (80286+) - COPROCESSOR ERROR
  source: INTERRUP.A:996
  interrupt: '10'
  flags:
  - C
  input_registers: []
  returns: []
  description: 'this interrupt is generated by the CPU when the -ERROR pin is asserted

    by the coprocessor'
  notes:
  - 'AT''s and clones usually wire the coprocessor to use IRQ13, but not all

    get it right'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: 09
    params: {}
    name: hardware
  - type: interrupt
    interrupt: '75'
    params: {}
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: V-10
  category: V
  title: LIRVGA19 - CHAR HEIGHT HOOK
  source: INTERRUP.A:1003
  interrupt: '10'
  flags: []
  input_registers: []
  returns: []
  description: 'LIRVGA19.COM fixes display problems on some notebooks by hooking

    INT 10h and resetting the BIOS character height (MEM 0040h:0085h)

    to 10h on return, if it happens to be greater than 10h.'
  program: 'LIRVGA19.COM is part of the Lithuanian LIR codepage support package

    developed by LABAS u.a.b.'
  notes: []
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '10'
    params:
      AX: 5555h
      BX: BBBBh
  - type: memory
    address: 0040h:0085h
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: V-1000
  category: V
  title: VIDEO - SET VIDEO MODE
  source: INTERRUP.A:1011
  interrupt: '10'
  flags: []
  function: '00'
  input_registers:
  - reg: AH
    operator: '='
    value: 00h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: 'desired video mode (see #00010)'
    table_refs:
    - '00010'
    sub_values: []
  returns:
  - registers:
    - reg: AL
      operator: '='
      description: video mode flag (Phoenix, AMI BIOS)
      table_refs: []
      sub_values: []
    - reg: AL
      operator: '='
      description: CRT controller mode byte (Phoenix 386 BIOS v1.10)
      table_refs: []
      sub_values: []
    raw_lines: []
  description: specify the display mode for the currently active display adapter
  notes:
  - 'IBM standard modes do not clear the screen if the high bit of AL is set

    (EGA or higher only)

    the Tseng ET4000 chipset is used by the Orchid Prodesigner II, Diamond

    SpeedSTAR VGA, Groundhog Graphics Shadow VGA, Boca Super X VGA,

    Everex EV-673, etc.

    intercepted by GRAFTABL from Novell DOS 7 and Caldera OpenDOS 7.01.'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AX: 0070h
  - type: interrupt
    params:
      AX: 007Eh
  - type: interrupt
    params:
      AX: 10E0h
  - type: interrupt
    params:
      AX: 10F0h
  - type: interrupt
    params:
      AH: 40h
  - type: interrupt
    params:
      AX: 6F05h
  - type: interrupt
    params:
      AH: FFh
    name: GO32
  - type: interrupt
    interrupt: '33'
    params:
      AX: 0028h
  - type: interrupt
    interrupt: 5F
    params:
      AH: 00h
  - type: interrupt
    interrupt: '62'
    params:
      AX: 0001h
  - type: memory
    address: 0040h:0049h
  install_check: 'for Ahead adapters, the signature "AHEAD" at C000h:0025h

    for Paradise adapters, the signature "VGA=" at C000h:007Dh

    for Oak Tech OTI-037/057/067/077 chipsets, the signature "OAK VGA" at

    C000h:0008h

    for ATI adapters, the signature "761295520" at C000h:0031h; the byte

    at C000h:0043h indicates the chipset revision:

    31h for 18800

    32h for 18800-1

    33h for 18800-2

    34h for 18800-4

    35h for 18800-5

    62h for 68800AX (Mach32) (see also #00732)

    the two bytes at C000h:0040h indicate the adapter type

    "22" EGA Wonder

    "31" VGA Wonder

    "32" EGA Wonder800+

    the byte at C000h:0042h contains feature flags

    bit 1: mouse port present

    bit 4: programmable video clock

    the byte at C000h:0044h contains additional feature flags if chipset

    byte > 30h (see #00009)

    for Genoa video adapters, the signature 77h XXh 99h 66h at C000h:NNNNh,

    where NNNNh is stored at C000h:0037h and XXh is

    00h for Genoa 6200/6300

    11h for Genoa 6400/6600

    22h for Genoa 6100

    33h for Genoa 5100/5200

    55h for Genoa 5300/5400

    for SuperEGA BIOS v2.41+, C000h:0057h contains the product level

    for Genoa SuperEGA BIOS v3.0+, C000h:0070h contains the signature

    "EXTMODE", indicating support for extended modes'
  index:
  - installation check;Tseng ET4000|installation check;Ahead video cards
  - installation check;Oak Technologies|installation check;ATI video cards
  - installation check;Paradise video|installation check;Genoa video cards
  tables:
  - 00009
  - '00010'
  table_refs:
  - 00009
  - '00732'
