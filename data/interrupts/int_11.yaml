- entry_type: INT
  id: C-11
  category: C
  title: CPU-generated (80486+) - ALIGNMENT CHECK
  source: INTERRUP.B:1035
  interrupt: '11'
  flags: []
  input_registers: []
  returns: []
  description: 'automatically generated by the CPU when the AC flag is set, the current

    privilege level is 3, and a misaligned memory access (WORD not on an

    even address or DWORD not on a multiple of 4) is made'
  notes:
  - 'not all V86 monitors allow the AC flag to be set, such as Turbo

    Debugger 386'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '12'
    params: {}
    name: CPU
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: B-11
  category: B
  title: BIOS - GET EQUIPMENT LIST
  source: INTERRUP.B:1043
  interrupt: '11'
  flags: []
  input_registers: []
  returns:
  - registers: []
    raw_lines:
    - '(E)AX = BIOS equipment list word (see #00226,#03215 at INT 4B"Tandy")'
  notes:
  - 'since older BIOSes do not know of the existence of EAX, the high word

    of EAX should be cleared before this call if any of the high bits

    will be tested'
  bugs: []
