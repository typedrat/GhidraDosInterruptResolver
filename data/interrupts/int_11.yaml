  - reg: AL
    operator: '='
    description: subfunction
    table_refs: []
    sub_values:
    - value: 01h
      description: 'request SFENGINE start Return: AX = 0001h'
      sub_values: []
    - value: 02h
      description: 'check if SFENGINE started Return: AX = 0000h or 0001h'
      sub_values: []
    - value: 03h
      description: 'request SFENGINE stop Return: AX = 0001h'
      sub_values: []
    - value: 04h
      description: 'check if SFENGINE stopped Return: AX = 0000h or 0001h'
      sub_values: []
    - value: 05h
      description: 'installation check Return: AX = 0001h'
      sub_values: []
    - value: 06h
      description: uninstall???
