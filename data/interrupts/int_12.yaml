- entry_type: INT
  id: C-12
  category: C
  title: CPU-generated (Pentium +) - MACHINE CHECK EXCEPTION
  source: INTERRUP.B:1422
  interrupt: '12'
  flags: []
  input_registers: []
  returns: []
  notes:
  - "Intel documents this interrupt as CPU model-dependent\nfor current Pentium processors, the reason for the machine check\n\
    exception may be read from model-specific registers 00h and 01h\n(described, for example, in Christian Ludloff's 4P package)\n\
    for Pentium Pro/II processors,\tthe reason may be read from the\nMCG_STATUS MSR (see MSR 0000017Ah)\nthis exception is\
    \ enabled by bit 6 of CR4"
  bugs: []
