        description: for good sector
        sub_values: []
      - value: 20h
        description: to unassign from alternate location
        sub_values: []
      - value: 40h
        description: to assign to alternate location
        sub_values: []
      - value: 80h
        description: for bad sector
        sub_values: []
  - reg: CH
    operator: '='
    description: cylinder number (bits 8,9 in high bits of CL)
    table_refs: []
    sub_values: []
  - reg: CL
    operator: '='
    description: high bits of cylinder number (bits 7,6)
    table_refs: []
    sub_values: []
  - reg: DH
    operator: '='
    description: head
    table_refs: []
    sub_values: []
  - reg: DL
    operator: '='
    description: drive
    table_refs: []
    sub_values: []
