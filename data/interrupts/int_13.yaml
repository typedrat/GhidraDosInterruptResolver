- entry_type: INT
  id: d-13EE
  category: d
  title: SWBIOS - SET 1024-CYLINDER FLAG
  source: INTERRUP.B:4831
  interrupt: '13'
  flags: []
  function: EE
  input_registers:
  - reg: AH
    operator: '='
    value: EEh
    table_refs: []
    sub_values: []
  - reg: DL
    operator: '='
    description: drive number (80h, 81h)
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    registers:
    - reg: AH
      operator: '='
      value: 00h
      table_refs: []
      sub_values: []
    raw_lines: []
  description: 'the following INT 13 call will add 1024 to the specified cylinder

    number to get the actual cylinder number desired'
  program: SWBIOS is a TSR by Ontrack Computer Systems
  notes:
  - 'the flag is cleared by all INT 13 calls except AH=EEh and AH=EFh

    Disk Manager also supports these calls

    this function is also supported by HyperDisk v4.01+ and PC-Cache v5.5+,

    in order to allow caching of drives using SWBIOS to access more than

    1024 cylinders

    for software which supports that call, this function is equivalent to

    calling AH=EFh with CX=0400h'
  bugs: []
  see_also:
