  input_registers:
  - reg: AH
    operator: '='
    value: 04h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: number of sectors to verify (must be nonzero)
    table_refs: []
    sub_values: []
  - reg: CH
    operator: '='
    description: low eight bits of cylinder number
    table_refs: []
    sub_values: []
  - reg: CL
    operator: '='
    description: sector number 1-63 (bits 0-5)
    table_refs: []
    sub_values: []
  - reg: DH
    operator: '='
    description: head number
    table_refs: []
    sub_values: []
  - reg: DL
    operator: '='
    description: drive number (bit 7 set for hard disk)
    table_refs: []
    sub_values: []
  - reg: ES:BX
    operator: ->
    description: data buffer (PC,XT,AT with BIOS prior to 1985/11/15)
    table_refs: []
    sub_values: []
  returns:
  - condition: CF set
    condition_description: on error
    registers: []
    raw_lines: []
  - condition: CF clear
    condition_description: if successful
    registers:
    - reg: AH
      operator: '='
      description: 'status (see #00234)'
      table_refs:
      - '00234'
      sub_values: []
    - reg: AL
      operator: '='
      description: number of sectors verified
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'errors on a floppy may be due to the motor failing to spin up quickly

    enough (timeout error 80h); the write should be retried at least

    three times, resetting the disk with AH=00h between attempts

    on floppys, the operation should also be retried on media change

    (06h) detection.

    this function does not compare the disk with memory, it merely

    checks whether the sector''s stored CRC matches the data''s actual CRC

    the IBM AT BIOS and many other BIOSes use only the low four bits of

    DH (head number) since the WD-1003 controller which is the standard

    AT controller (and the controller that IDE emulates) only supports

    16 heads

    AWARD AT BIOS and AMI 386sx BIOS have been extended to handle more

    than 1024 cylinders by placing bits 10 and 11 of the cylinder number

    into bits 6 and 7 of DH'
  bugs:
  - 'some Epson ROM BIOSes sometimes have problems properly handling this

    function. The workaround is to reset the disk (INT 13/AH=00h) before

    the call.'
  see_also:
