- entry_type: INT
  id: B-1302
  category: B
  title: DISK - READ SECTOR(S) INTO MEMORY
  source: INTERRUP.B:1641
  interrupt: '13'
  flags: []
  function: '02'
  input_registers:
  - reg: AH
    operator: '='
    value: 02h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: number of sectors to read (must be nonzero)
    table_refs: []
    sub_values: []
  - reg: CH
    operator: '='
    description: low eight bits of cylinder number
    table_refs: []
    sub_values: []
  - reg: CL
    operator: '='
    description: sector number 1-63 (bits 0-5)
    table_refs: []
    sub_values: []
  - reg: DH
    operator: '='
    description: head number
    table_refs: []
    sub_values: []
  - reg: DL
    operator: '='
    description: drive number (bit 7 set for hard disk)
    table_refs: []
    sub_values: []
  - reg: ES:BX
    operator: ->
    description: data buffer
    table_refs: []
    sub_values: []
  returns:
  - condition: CF set
    condition_description: on error
    registers: []
    raw_lines:
    - if AH = 11h (corrected ECC error), AL = burst length
  - condition: CF clear
    condition_description: if successful
    registers:
    - reg: AH
      operator: '='
      description: 'status (see #00234)'
      table_refs:
      - '00234'
      sub_values: []
    - reg: AL
      operator: '='
      description: number of sectors transferred (only valid if CF set for some
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'errors on a floppy may be due to the motor failing to spin up quickly

    enough; the read should be retried at least three times, resetting

    the disk with AH=00h between attempts

    most BIOSes support "multitrack" reads, where the value in AL

    exceeds the number of sectors remaining on the track, in which

    case any additional sectors are read beginning at sector 1 on

    the following head in the same cylinder; the MSDOS CONFIG.SYS command

    MULTITRACK (or the Novell DOS DEBLOCK=) can be used to force DOS to

    split disk accesses which would wrap across a track boundary into two

    separate calls

    the IBM AT BIOS and many other BIOSes use only the low four bits of

    DH (head number) since the WD-1003 controller which is the standard

    AT controller (and the controller that IDE emulates) only supports

    16 heads

    AWARD AT BIOS and AMI 386sx BIOS have been extended to handle more

    than 1024 cylinders by placing bits 10 and 11 of the cylinder number

    into bits 6 and 7 of DH

    under Windows95, a volume must be locked (see INT 21/AX=440Dh/CX=084Bh)

    in order to perform direct accesses such as INT 13h reads and writes

    all versions of MS-DOS (including MS-DOS 7 [Windows 95]) have a bug

    which prevents booting on hard disks with 256 heads (FFh), so many

    modern BIOSes provide mappings with at most 255 (FEh) heads

    some cache drivers flush their buffers when detecting that DOS is

    bypassed by directly issuing INT 13h from applications.  A dummy

    read can be used as one of several methods to force cache

    flushing for unknown caches (e.g. before rebooting).'
  bugs:
  - "When reading from floppies, some AMI BIOSes (around 1990-1991) trash\nthe byte following the data buffer, if it is not\
    \ arranged to an even\nmemory boundary.  A workaround is to either make the buffer word\naligned (which may also help\
    \ to speed up things), or to add a dummy\nbyte after the buffer.\nMS-DOS may leave interrupts disabled on return from\
    \ this function.\nApparently some BIOSes or intercepting resident software have bugs\nthat may destroy DX on return or\
    \ not properly set the Carry flag.\nAt least some Microsoft software frames calls to this function with\nPUSH DX, STC,\
    \ INT 13h, STI, POP DX.\non the original IBM AT BIOS (1984/01/10) this function does not disable\ninterrupts for harddisks\
    \ (DL >= 80h).\t On these machines the MS-DOS/\nPC DOS IO.SYS/IBMBIO.COM installs a special filter to bypass the\nbuggy\
    \ code in the ROM (see CALL F000h:211Eh)"
  see_also:
  - type: interrupt
    params:
      AH: 03h
  - type: interrupt
    params:
      AH: 0Ah
  - type: interrupt
    params:
      AH: 06h
    name: V10DISK.SYS
  - type: interrupt
    params:
      AH: 21h
    name: PS/1
  - type: interrupt
    params:
      AH: 42h
    name: IBM
  - type: interrupt
    interrupt: '21'
    params:
      AX: 440Dh
      CX: 084Bh
  - type: interrupt
    interrupt: 4D
    params:
      AH: 02h
  index: []
  tables: []
  table_refs: []
- entry_type: INT
