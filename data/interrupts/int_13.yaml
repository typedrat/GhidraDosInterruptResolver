- entry_type: INT
  id: B-1300
  category: B
  title: DISK - RESET DISK SYSTEM
  source: INTERRUP.B:1578
  interrupt: '13'
  flags: []
  function: '00'
  input_registers:
  - reg: AH
    operator: '='
    value: 00h
    table_refs: []
    sub_values: []
  - reg: DL
    operator: '='
    description: drive (if bit 7 is set both hard disks and floppy disks reset)
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AH
      operator: '='
      description: 'status (see #00234)'
      table_refs:
      - '00234'
      sub_values: []
    raw_lines: []
  - condition: CF clear
    condition_description: if successful (returned AH=00h)
    registers: []
    raw_lines: []
  - condition: CF set
    condition_description: on error
    registers: []
    raw_lines: []
  notes:
  - 'forces controller to recalibrate drive heads (seek to track 0)

    for PS/2 35SX, 35LS, 40SX and L40SX, as well as many other systems,

    both the master drive and the slave drive respond to the Reset

    function that is issued to either drive'
  bugs: []
