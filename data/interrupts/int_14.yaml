- entry_type: INT
  id: --1405
  title: PhysTechSoft PTS ROM-DOS - SET PACKET
  source: INTERRUP.B:5641
  interrupt: '14'
  flags: []
  function: '05'
  input_registers:
  - reg: AH
    operator: '='
    value: 05h
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: packet length
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    description: port number
    table_refs: []
    sub_values: []
  - reg: DS:SI
    operator: ->
    description: packet
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AH
      operator: '='
      description: error code (0 = no error, -1 = error)
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - "The embedded PC can send messages at any time. The managing PC may\nforce the embedded PC to receive messages only after\
    \ causing a reset\non the remote embedded PC.\n!!!from Matthias Paul:\nDescription of the high-level control packets:\n\
    After the reset the embedded PC will send a 4-byte packet \"LOAD\"\nto the managing PC to indicate it is now able to receive\
    \ commands.\nThe managing PC can send commands using 6-byte sized packets starting\nwith \"COMM\" followed by a 2-byte\
    \ command code:\n\"01\" demand setup information\n\"02\" demand sending of diagnostic information\nIf diagnostic information\
    \ is requested, the embedded PC will send back\na header packet starting with 4-byte \"DIAG\" followed by 2 bytes\nindicating\
    \ the count of diagnostic data packets following. Each\ndiagnostic data packet is sized 134 bytes, starting with the 4-byte\n\
    \"DIAG\", a 2-byte number packet, followed by 128 bytes of data.\nIf setup information is requested, the embedded PC will\
    \ send back\n8 bytes length packets starting with \"SETP\" and 2 byte of setup\ninformation of the LOADER and BIOS. The\
    \ contents varies.\nIf the embedded PC requests the managing PC to send a BIOS it will\nsend a 4 byte packet \"BIOS\"\
    .\nThe managing PC will then send back a 6-byte sized BIOS header packet\nstarting with \"BIOS\" and a 2-byte indicator\
    \ of the BIOS image size\nin packets.\nThe embedded PC will answer by sending a 6 byte packet starting with\n\"BIOS\"\
    \ followed by the running number of the demanded packet.\nThe managing PC will then send the requested part of the BIOS\
    \ image\nin a 134 byte sized packet, starting with \"BIOS\", the 2 byte running\nnumber of the packet and 128 bytes of\
    \ the actual BIOS info.\nThe embedded PC acknowledges that it received the BIOS with a 6-byte\npacket \"BIOS\", followed\
    \ by 2-bytes of 0.\nIf the embedded PCs requests the managing PC to send the operating\nsystem, it will follow the same\
    \ proceduce as for requesting the\nBIOS. The only difference is that instead of \"BIOS\", the string\n\"PTOS\" will be\
    \ used in the communication.\nDebug information packets have a length of 32 bytes starting with\nthe 4-byte \"DEBU\" signature,\
    \ and followed by the contents of the\nPCU registers in the following order: SP, SS, ES, DS, BP, DI, SI,\nDX, CX, BX,\
    \ AX, IP, CS, Flags. Debug information is send after\nreaching the corresponding breakpoint.\nDescription of the low-level\
    \ packet protocol:\nBefore sending a packet the sending side sends a byte 52h and for a\ncertain time (ca. 1 second for\
    \ the embedded PC) waits for\nconfirmation (41h) from the receiving side. If no acknowledge is\nreceived this\tprocedure\
    \ is repeated 4 more times before an error is\nreturned.\nIf acknowledge was received the following information is sent:\n\
    2 BYTEs  synchronization (50h, 50h)\nBYTE\t  data packet size - 1\n2 BYTEs  CRC of the data\nvar.\t  data\n2 BYTEs  synchronization\
    \ (F0h, F0h)\nThe receiving side must acknowledge this by sending back two bytes\n59h, 59h. If the sender does not receive\
    \ the confirmation, it\ntries 4 more times before returning an error."
  bugs: []
  see_also:
  - type: interrupt
    params:
      AH: 06h
  - type: interrupt
    params:
      AX: E908h
  - type: interrupt
    params: {}
    name: INT 15h/E909h
