  flags: []
  function: 00DXFFFF
  input_registers:
  - reg: AH
    operator: '='
    value: 00h
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    value: FFFFh
    table_refs: []
    sub_values: []
  - reg: ES:DI
    operator: ->
    description: vector string specifying new parameters
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AH
      operator: '='
      description: 'return code (00h,03h) (see #00303)'
      table_refs:
      - '00303'
      sub_values: []
    raw_lines: []
  program: 'Connection Manager by Softwarehouse Corp. permits the sharing of

    serial ports over an IPX or NetBIOS-based network'
  notes:
  - 'if DX is 0-3 on entry, Connection Manager emulates the standard BIOS

    function, but redirects the port over the network; if DX is any other

    value, the call is chained'
