- entry_type: INT
  id: S-1400
  category: S
  title: SERIAL - INITIALIZE PORT
  source: INTERRUP.B:4952
  interrupt: '14'
  flags: []
  function: '00'
  input_registers:
  - reg: AH
    operator: '='
    value: 00h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: 'port parameters (see #00300)'
    table_refs:
    - '00300'
    sub_values: []
  - reg: DX
    operator: '='
    description: port number (00h-03h) (04h-43h for Digiboard XAPCM232.SYS)
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AH
      operator: '='
      description: 'line status (see #00304)'
      table_refs:
      - '00304'
      sub_values: []
    - reg: AL
      operator: '='
      description: 'modem status (see #00305)'
      table_refs:
      - '00305'
      sub_values: []
    raw_lines: []
  notes:
  - 'default handler is at F000h:E739h in IBM PC and 100% compatible BIOSes

    since the PCjr supports a maximum of 4800 bps, attempting to set 9600

    bps will result in 4800 bps

    various network and serial-port drivers support the standard BIOS

    functions with interrupt-driven I/O instead of the BIOS''s polled I/O

    the 1993/04/08 Compaq system ROM uses only the low two bits of DX

    the default setting used by DOS (MS-DOS 6, DR-DOS 7.03, PTS-DOS) when

    (re-)initializing the serial devices is AL=A3h (2400 bps, no parity,

    1 stop bit, 8 data bits).'
  bugs: []
  see_also:
