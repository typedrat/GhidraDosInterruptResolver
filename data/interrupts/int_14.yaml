- entry_type: INT
  id: S-1400
  category: S
  title: FOSSIL (Fido/Opus/Seadog Standard Interface Level) - INITIALIZE
  source: INTERRUP.B:4980
  interrupt: '14'
  flags: []
  function: '00'
  input_registers:
  - reg: AH
    operator: '='
    value: 00h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: initializing parameters
    table_refs: []
    sub_values:
    - value: '7'
      description: "- 6 - 5\t   4 - 3     2\t  1 - 0 -BAUD RATE-\t   PARITY   STOP   WORD BITS  LENGTH"
      sub_values: []
    - value: '000'
      description: '19200 bd   00 none  0: 1  00: 5'
      sub_values: []
    - value: '001'
      description: '38400 bd   01 odd   1: 2  01: 6'
      sub_values: []
    - value: '010'
      description: "300 bd   11 even\t  10: 7"
      sub_values: []
    - value: '011'
      description: "600 bd\t\t  11: 8"
      sub_values: []
    - value: '100'
      description: 1200 bd
      sub_values: []
    - value: '101'
      description: 2400 bd
      sub_values: []
    - value: '110'
      description: 4800 bd
      sub_values: []
    - value: '111'
      description: 9600 bd (4800 on PCjr)
      sub_values: []
  - reg: DX
    operator: '='
    description: port number (0-3 or FFh if only performing non-I/O setup)
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AH
      operator: '='
      description: 'RS-232 status code bits (see #00301)'
      table_refs:
      - '00301'
      sub_values: []
    - reg: AL
      operator: '='
      description: modem status bits
      table_refs: []
      sub_values: []
    raw_lines: []
  notes: []
  bugs: []
  see_also:
  - type: table
    id: '00300'
  - type: interrupt
    params:
      AH: 05h
    name: FOSSIL
  - type: interrupt
