  id: B-154F
  category: B
  title: KEYBOARD - KEYBOARD INTERCEPT (AT model 3x9,XT2,XT286,CONV,PS)
  source: INTERRUP.C:3627
  interrupt: '15'
  flags:
  - C
  function: 4F
  input_registers:
  - reg: AH
    operator: '='
    value: 4Fh
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: 'hardware scan code (see #00006)'
    table_refs:
    - '00006'
    sub_values: []
  - reg: CF
    operator: set
    table_refs: []
    sub_values: []
  returns:
  - condition: CF set
    condition_description: to continue processing scan code
    registers:
    - reg: AL
      operator: '='
      description: 'possibly-altered hardware scan code (see #00006)'
      table_refs:
      - '00006'
      sub_values: []
    raw_lines: []
  - condition: CF clear
    registers: []
    raw_lines:
    - scan code should be ignored
  notes:
  - 'called by INT 09 handler to translate scan codes; the INT 09 code does

    not examine the scan code it reads from the keyboard until after

    this function returns.  This permits software to rearrange the

    keyboard; for example, swapping the CapsLock and Control keys, or

    turning the right Shift key into Enter.

    DOS 6 KEYB.COM will not pass through this function if Ctrl-Alt-Del is

    pressed and a SmartDrive v4-compatible cache is installed which has

    dirty cache buffers; some other disk caches such as HyperDisk

    operate similarly in order to prevent loss of cached data which has

    not yet been written to disk

    IBM classifies this function as required'
