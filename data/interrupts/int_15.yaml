- entry_type: INT
  id: b-15E801
  category: b
  title: Phoenix BIOS v4.0 - GET MEMORY SIZE FOR >64M CONFIGURATIONS
  source: INTERRUP.D:37
  interrupt: '15'
  flags: []
  function: E801
  input_registers:
  - reg: AX
    operator: '='
    value: E801h
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers:
    - reg: AX
      operator: '='
      description: extended memory between 1M and 16M, in K (max 3C00h = 15MB)
      table_refs: []
      sub_values: []
    - reg: BX
      operator: '='
      description: extended memory above 16M, in 64K blocks
      table_refs: []
      sub_values: []
    - reg: CX
      operator: '='
      description: configured memory 1M to 16M, in K
      table_refs: []
      sub_values: []
    - reg: DX
      operator: '='
      description: configured memory above 16M, in 64K blocks
      table_refs: []
      sub_values: []
    raw_lines: []
  - condition: CF set
    condition_description: on error
    registers: []
    raw_lines: []
  notes:
  - 'supported by the A03 level (6/14/94) and later XPS P90 BIOSes, as well

    as the Compaq Contura, 3/8/93 DESKPRO/i, and 7/26/93 LTE Lite 386 ROM

    BIOS

    supported by AMI BIOSes dated 8/23/94 or later

    on some systems, the BIOS returns AX=BX=0000h; in this case, use CX

    and DX instead of AX and BX

    this interface is used by Windows NT 3.1, OS/2 v2.11/2.20, and is

    used as a fall-back by newer versions if AX=E820h is not supported

    this function is not used by MS-DOS 6.0 HIMEM.SYS when an EISA machine

    (for example with parameter /EISA) (see also MEM F000h:FFD9h), or no

    Compaq machine was detected, or parameter /NOABOVE16 was given.'
