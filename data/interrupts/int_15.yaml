- entry_type: INT
  id: T-1501
  category: T
  title: MultiDOS Plus - REQUEST RESOURCE SEMAPHORE
  source: INTERRUP.B:9304
  interrupt: '15'
  flags: []
  function: '01'
  input_registers:
  - reg: AH
    operator: '='
    value: 01h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: semaphore number (00h-3Fh)
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AH
      operator: '='
      description: status
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'if the semaphore is not owned, ownership is assigned to the calling

    task and the call returns immediately

    if the semaphore is already owned by another task, the calling task

    is placed on a queue for the semaphore and suspended until it can

    become owner of the semaphore

    semaphore 0 is used internally by MultiDOS to synchronize DOS access'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AH: 02h
    name: MultiDOS
  - type: interrupt
    params:
      AH: 10h
    name: MultiDOS
  - type: interrupt
    params:
      AH: 1Bh
    name: MultiDOS
