  - reg: BX
    operator: '='
    description: device ID of system BIOS (0000h)
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers:
    - reg: AX
      operator: '='
      description: real-mode segment base address of protected-mode 16-bit code
      table_refs: []
      sub_values: []
    - reg: BX
      operator: '='
      description: offset of entry point
      table_refs: []
      sub_values: []
    - reg: CX
      operator: '='
      description: real-mode segment base address of protected-mode 16-bit data
      table_refs: []
      sub_values: []
    - reg: SI
      operator: '='
      description: APM BIOS code segment length
      table_refs: []
      sub_values: []
    - reg: DI
      operator: '='
      description: APM BIOS data segment length
      table_refs: []
      sub_values: []
    raw_lines: []
  - condition: CF set
    condition_description: on error
    registers:
    - reg: AH
      operator: '='
      description: 'error code (02h,05h,06h,07h,09h) (see #00473)'
      table_refs:
      - '00473'
      sub_values: []
    raw_lines: []
  notes:
  - 'the caller must initialize two consecutive descriptors with the

    returned segment base addresses; these descriptors must be valid

    whenever the protected-mode interface is called, and will have

    their limits arbitrarily set to 64K.

    the protected mode interface is invoked by making a far call with the

    same register values as for INT 15; it must be invoked while CPL=0,

    the code segment descriptor must have a DPL of 0, the stack must be

    in a 16-bit segment and have enough room for BIOS use and possible

    interrupts, and the current I/O permission bit map must allow access

    to the I/O ports used for power management.

    functions 00h-03h are not available from protected mode

    on connection, an APM v1.1 or v1.2 BIOS switches to APM v1.0

    compatibility mode until it is informed that the user supports a

    newer version of APM (see AX=530Eh)'
