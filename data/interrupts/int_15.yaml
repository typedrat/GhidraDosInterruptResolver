- entry_type: INT
  id: Q-1512BX0400
  category: Q
  title: TopView - SEND MESSAGE - "APPLY" - WRITE PANEL TO WINDOW
  source: INTERRUP.C:1148
  interrupt: '15'
  flags: []
  function: 12BX0400
  input_registers:
  - reg: AH
    operator: '='
    value: 12h
    table_refs: []
    sub_values: []
  - reg: BX
    operator: '='
    value: 0400h
    table_refs: []
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - 'STACK: DWORD handle of window which was used'
    - DWORD handle of keyboard or 0
  notes:
  - "status of APPLY may be checked with STATUS message\npanel MUST have the following format\nfirst byte must be 1Bh (i.e.\
    \ must start with a stream)\nfirst opcode in stream must be E5h\nsingle byte arg of opcode is interpreted thus:\nbits\
    \ 7,6\t11 means create new window\n10 means create new field table for existing window\n01 means use existing window and\
    \ field table\nbit 5 if set, panel contains a field table\n(creates a new keyboard and puts it in field mode)\nbit 4 if\
    \ set, panel contains input fields\nbit 3 if set, panel contains select fields but no input fields\nif the panel contains\
    \ input or select fields, a keyboard handle is\nreturned; either the window's current open keyboard or a\nnewly-created\
    \ keyboard object.  The caller should read that keyboard\nto obtain input from the panel."
