  id: b-15E820
  category: b
  title: newer BIOSes - GET SYSTEM MEMORY MAP
  source: INTERRUP.D:68
  interrupt: '15'
  flags: []
  function: E820
  input_registers:
  - reg: AX
    operator: '='
    value: E820h
    table_refs: []
