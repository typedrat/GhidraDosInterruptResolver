- entry_type: INT
  id: p-155305
  category: p
  title: Advanced Power Management v1.0+ - CPU IDLE
  source: INTERRUP.C:3861
  interrupt: '15'
  flags: []
  function: '5305'
  input_registers:
  - reg: AX
    operator: '='
    value: 5305h
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful (after system leaves idle state)
    registers: []
    raw_lines: []
  - condition: CF set
    condition_description: on error
    registers:
    - reg: AH
      operator: '='
      description: 'error code (03h,0Bh) (see #00473)'
      table_refs:
      - '00473'
      sub_values: []
    raw_lines: []
  notes:
  - 'call when the system is idle and should be suspended until the next

    system event or interrupt

    should not be called from within a hardware interrupt handler to avoid

    reentrance problems

    if an interrupt causes the system to resume normal processing, the

    interrupt may or may not have been handled when the BIOS returns

    from this call; thus, the caller should allow interrupts on return

    interrupt handlers may not retain control if the BIOS allows

    interrupts while in idle mode even if they are able to determine

    that they were called from idle mode

    the caller should issue this call continuously in a loop until it needs

    to perform some processing of its own'
