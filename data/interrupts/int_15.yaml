- entry_type: INT
  id: Q-1512BH0C
  category: Q
  title: TopView - SEND MESSAGE - "OPEN" - OPEN OBJECT
  source: INTERRUP.C:2072
  interrupt: '15'
  flags: []
  function: 12BH0C
  input_registers:
  - reg: AH
    operator: '='
    value: 12h
    table_refs: []
    sub_values: []
  - reg: BH
    operator: '='
    value: 0Ch
    table_refs: []
    sub_values: []
  - reg: BL
    operator: '='
    description: object
    table_refs: []
    sub_values:
    - value: 00h
      description: "handle is DWORD on top of stack window:\t  fill with given character from scroll origin to end keyboard:\
        \ attach to a window timer:\t  open pointer:  start taking input for window panel:\t  associate with a panel file"
      sub_values: []
    - value: 01h
      description: fill task's default window with given char from scrl org to end
      sub_values: []
    - value: 02h
      description: open given task's mailbox for input (task's handle on stack)
      sub_values: []
    - value: 03h
      description: open current task's mailbox
      sub_values: []
    - value: 04h
      description: attach a KEYBOARD to a window (handle on top of stack)
      sub_values: []
    - value: 05h
      description: attach task's default KEYBOARD to a window
      sub_values: []
    - value: 06h
      description: open a task's OBJECTQ (task's handle on top of stack)
      sub_values: []
    - value: 07h
      description: open current task's OBJECTQ
      sub_values: []
    - value: 0Ch
      description: (DV 2.26+) fill def window of task owning handle on top of stck
      sub_values: []
    - value: 0Dh
      description: '(DV 2.26+) fill default window of parent of current task STACK: (if window)   DWORD character to fill
        with (if keyboard) DWORD handle of window to attach to (if pointer)  DWORD handle of window to attach to (if panel)    DWORD
        length of filename or resident panel DWORD address of filename or resident panel (otherwise)   nothing'
      sub_values: []
  returns:
  - registers: []
    raw_lines:
    - STACK popped
  notes:
  - 'if first byte of panel file name is 1Bh, then the "name" IS a panel

    if first two bytes of panel file "name" are C0hC3h, then the "name" IS

    the panel file

    result code of open may be retrieved with STATUS message

    logical cursor is left at scroll origin after filling window

    the task opening a mailbox becomes its owner, and the only task allowed

    to read the mailbox

    messages are only sent to a pointer object when the mouse is positioned

    in the window to which the pointer has been attached

    there is no need to explicitly open a timer object, as ADDTO and WRITE

    messages automatically open the timer'
