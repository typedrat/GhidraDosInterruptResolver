- entry_type: INT
  id: B-1590
  category: B
  title: OS HOOK - DEVICE BUSY (AT,PS)
  source: INTERRUP.C:5852
  interrupt: '15'
  flags: []
  function: '90'
  input_registers:
  - reg: AH
    operator: '='
    value: 90h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: 'device type (see #00507)'
    table_refs:
    - '00507'
    sub_values: []
  - reg: ES:BX
    operator: ->
    description: request block for type codes 80h through BFh
    table_refs: []
    sub_values: []
  - reg: CF
    operator: clear
    table_refs: []
    sub_values: []
  returns:
  - condition: CF set
    condition_description: if wait time satisfied
    registers: []
    raw_lines: []
  - condition: CF clear
    condition_description: if driver must perform wait
    registers:
    - reg: AH
      operator: '='
      value: 00h
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'type codes are allocated as follows:

    00-7F non-reentrant devices; OS must arbitrate access

    80-BF reentrant devices; ES:BX points to a unique control block

    C0-FF wait-only calls, no complementary INT 15/AH=91h call

    floppy and hard disk BIOS code uses this call to implement a timeout;

    for device types 00h and 01h, a return of CF set means that the

    timeout expired before the disk responded.

