- entry_type: INT
  id: Q-1512BH01
  category: Q
  title: TopView - SEND MESSAGE - "NEW" - CREATE NEW OBJECT
  source: INTERRUP.C:971
  interrupt: '15'
  flags: []
  function: 12BH01
  input_registers:
  - reg: AH
    operator: '='
    value: 12h
    table_refs: []
    sub_values: []
  - reg: BH
    operator: '='
    value: 01h
    table_refs: []
    sub_values: []
  - reg: BL
    operator: '='
    description: 'object type to create (see #00435)'
    table_refs:
    - '00435'
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - DWORD on top of stack is new object handle
  notes:
  - 'if a new task is created, it is started with

    AX = BX = SI = DI = BP = 0

    DX:CX = handle of parent task

    DS = ES = SS = segment of private stack (and new task''s handle)

    new windows are orphans, inherit the colors/hidden status of the

    creating task''s window, and are placed in the upper left hand corner

    of the screen but not automatically redrawn

    new keyboards are closed, and have all object bits cleared except for

    the hardware cursor bit'
