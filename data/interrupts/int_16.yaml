- entry_type: INT
  id: B-1610
  category: B
  title: KEYBOARD - GET ENHANCED KEYSTROKE (enhanced kbd support only)
  source: INTERRUP.D:511
  interrupt: '16'
  flags: []
  function: '10'
  input_registers:
  - reg: AH
    operator: '='
    value: 10h
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AH
      operator: '='
      description: BIOS scan code
      table_refs: []
      sub_values: []
    - reg: AL
      operator: '='
      description: ASCII character
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'if no keystroke is available, this function waits until one is placed

    in the keyboard buffer

    the BIOS scan code is usually, but not always, the same as the hardware

    scan code processed by INT 09.  It is the same for ASCII keystrokes

    and most unshifted special keys (F-keys, arrow keys, etc.), but

    differs for shifted special keys.

    unlike AH=00h, this function does not discard extended keystrokes

    INT 16/AH=09h can be used to determine whether this function is

    supported, but only on later model PS/2s'
  bugs: []
