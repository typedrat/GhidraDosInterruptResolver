- entry_type: INT
  id: J-165000
  category: J
  title: KEYBOARD - AX PC - SET KEYBOARD COUNTRY CODE
  source: INTERRUP.D:1020
  interrupt: '16'
  flags: []
  function: '5000'
  input_registers:
  - reg: AX
    operator: '='
    value: 5000h
    table_refs: []
    sub_values: []
  - reg: BX
    operator: '='
    description: country code
    table_refs: []
    sub_values:
    - value: 0001h
      description: USA (English), 0051h Japan
      sub_values: []
  returns:
  - registers:
    - reg: AL
      operator: '='
      description: status
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'This function is called with BX=0051h by Japanese versions of

    MS-DOS/PC DOS/DR DOS IO.SYS/IBMBIO.COM at initialization time.

    the K3PLUS v6.00+ INT 16 BIOS replacement will switch between the

    supported country specific layout (e.g. BX=0031h Germany, BX=001Fh

    Netherlands, BX=0020h Belgium, BX=0022h Spain) (as with <Ctrl>+

    <Alt>+<F2>) and K3PLUS'' transparent mode (as with <Ctrl>+<Alt>+<F1>).

    In transparent mode (BX=0001h), K3PLUS chains to the underlying

    driver (normally the BIOS driver with US-layout). K3PLUS beeps on

    mode changes'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AX: 5001h
