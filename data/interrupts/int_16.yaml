- entry_type: INT
  id: A-1655FE
  category: A
  title: Microsoft QBASIC internal - MICROSOFT COOPERATION WITH TSR
  source: INTERRUP.D:1096
  interrupt: '16'
  flags:
  - C
  - U
  function: 55FE
  input_registers:
  - reg: AX
    operator: '='
    value: 55FEh
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    description: function
    table_refs: []
    sub_values:
    - value: 0000h
      description: initialize
      sub_values: []
  - reg: ES:BX
    operator: ->
    description: ??? function
    table_refs: []
    sub_values: []
  - reg: ES:CX
    operator: ->
    description: ??? structure
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      description: result
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'The pointer in ES:CX seems to point at a structure defining a callback

    function when new keyboard keys are pressed. If a TSR returns

    AX=4D4Bh, QBASIC will stop (with IRQ''s and interrupts enabled).

    these calls are also made by MS-DOS 6.0''s DOSSHELL at startup, exit,

    and before/after shelling out

    since EDIT.COM and HELP.COM merely invoke QBASIC, those two programs

    will also cause this interface to be invoked

    K3PLUS v6.07+ supports this function, but will never invoke the

    callback function'
  bugs: []
