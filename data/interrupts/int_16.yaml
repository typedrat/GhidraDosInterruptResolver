- entry_type: INT
  id: B-1603
  category: B
  title: KEYBOARD - SET TYPEMATIC RATE AND DELAY
  source: INTERRUP.D:332
  interrupt: '16'
  flags: []
  function: '03'
  input_registers:
  - reg: AH
    operator: '='
    value: 03h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: subfunction
    table_refs: []
    sub_values:
    - value: 00h
      description: set default delay and rate (PCjr and some PS/2)
      sub_values: []
    - value: 01h
      description: increase delay before repeat (PCjr)
      sub_values: []
    - value: 02h
      description: decrease repeat rate by factor of 2 (PCjr)
      sub_values: []
    - value: 03h
      description: increase delay and decrease repeat rate (PCjr)
      sub_values: []
    - value: 04h
      description: turn off typematic repeat (PCjr and some PS/2)
      sub_values: []
    - value: 05h
      description: set repeat rate and delay (AT,PS)
      sub_values: []
  - reg: BH
    operator: '='
    description: delay value (00h = 250ms to 03h = 1000ms)
    table_refs: []
    sub_values: []
  - reg: BL
    operator: '='
    description: repeat rate (00h=30/sec to 0Ch=10/sec [def] to 1Fh=2/sec)
    table_refs: []
    sub_values: []
  - reg: BH
    operator: '='
    description: delay (above)
    table_refs: []
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - AH destroyed by many BIOSes
  notes:
  - 'use INT 16/AH=09h to determine whether some of the subfunctions are

    supported'
