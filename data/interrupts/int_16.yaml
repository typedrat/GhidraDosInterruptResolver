- entry_type: INT
  id: --160600
  title: AAKEYS - GET NEXT KEYBOARD EVENT
  source: INTERRUP.D:429
  interrupt: '16'
  flags: []
  function: '0600'
  input_registers:
  - reg: AX
    operator: '='
    value: 0600h
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers:
    - reg: AL
      operator: '='
      description: next keyboard event in event buffer, FFh if buffer overflowed
      table_refs: []
      sub_values: []
    raw_lines: []
  - condition: CF set
    condition_description: on error
    registers:
    - reg: AL
      operator: '='
      value: 00h
      description: buffer empty
      table_refs: []
      sub_values: []
    raw_lines: []
  program: 'AAKEYS is a TSR by Anthony Appleyard which records keyboard scan

    codes in a 256-byte buffer in addition to any normal processing which

    takes place'
  notes:
  - 'the installation check consists of calling INT 16/AX=06xxh (where ''xx''

    is any subfunction other than those listed here) and testing whether

    AX=BEEFh on return'
  bugs: []
  see_also:
