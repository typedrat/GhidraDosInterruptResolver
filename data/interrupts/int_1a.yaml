- entry_type: INT
  id: B-1A02
  category: B
  title: TIME - GET REAL-TIME CLOCK TIME (AT,XT286,PS)
  source: INTERRUP.D:5801
  interrupt: 1A
  flags: []
  function: '02'
  input_registers:
  - reg: AH
    operator: '='
    value: 02h
    table_refs: []
    sub_values: []
  - reg: CF
    operator: clear
    description: to avoid bug (see below)
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers:
    - reg: CH
      operator: '='
      description: hour (BCD)
      table_refs: []
      sub_values: []
    - reg: CL
      operator: '='
      description: minutes (BCD)
      table_refs: []
      sub_values: []
    - reg: DH
      operator: '='
      description: seconds (BCD)
      table_refs: []
      sub_values: []
    - reg: DL
      operator: '='
      description: daylight savings flag (00h standard time, 01h daylight time)
      table_refs: []
      sub_values: []
    raw_lines: []
  - condition: CF set
    condition_description: on error (i.e. clock not running or in middle of update)
    registers: []
    raw_lines: []
  notes:
  - 'this function is also supported by the Sperry PC, which predates the

    IBM AT; the data is returned in binary rather than BCD on the Sperry,

    and DL is always 00h

    MS-DOS/PC DOS IO.SYS/IBMBIO.COM use this function to detect if a RTC

    is preset by checking if the returned values are non-zero. If they

    are, this function is called one more time, before it is assumed

    that no RTC is present.'
  bugs:
  - 'some BIOSes leave CF unchanged if successful, so CF should be cleared

    before calling this function'
  see_also:
