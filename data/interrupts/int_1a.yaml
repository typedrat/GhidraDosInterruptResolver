- entry_type: INT
  id: A-1A3601
  category: A
  title: WORD PERFECT v5.0 Third Party Interface - INSTALLATION CHECK
  source: INTERRUP.D:6042
  interrupt: 1A
  flags: []
  function: '3601'
  input_registers:
  - reg: AX
    operator: '='
    value: 3601h
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: DS:SI
      operator: '='
      description: routine to monitor keyboard input, immediately preceded by the
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - "WordPerfect 5.0 will call this interrupt at start up to determine if a\nthird party product wants to interface with it.\
    \  The third party\nproduct must intercept this interrupt and return the address of a\nkeyboard monitor routine.\nBefore\
    \ checking for keyboard input, and after every key entered by the\nuser, Word Perfect will call the routine whose address\
    \ was provided\nin DS:SI with the following parameters:\nEntry:\tAX = key code or 0\nBX = WordPerfect state flag\nExit:\t\
    AX = 0 or key code\nBX = 0 or segment address of buffer with key codes\nSee the \"WordPerfect 5.0 Developer's Toolkit\"\
    \ for further information."
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '16'
    params:
      AX: 5500h
