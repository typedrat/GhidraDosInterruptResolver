- entry_type: INT
  id: B-1A06
  category: B
  title: TIME - SET ALARM (AT,XT286,PS)
  source: INTERRUP.D:5925
  interrupt: 1A
  flags: []
  function: '06'
  input_registers:
  - reg: AH
    operator: '='
    value: 06h
    table_refs: []
    sub_values: []
  - reg: CH
    operator: '='
    description: hour (BCD)
    table_refs: []
    sub_values: []
  - reg: CL
    operator: '='
    description: minutes (BCD)
    table_refs: []
    sub_values: []
  - reg: DH
    operator: '='
    description: seconds (BCD)
    table_refs: []
    sub_values: []
  returns:
  - condition: CF set
    condition_description: on error (alarm already set or clock stopped for update)
    registers: []
    raw_lines: []
  - condition: CF clear
    condition_description: if successful
    registers: []
    raw_lines: []
  notes:
  - 'the alarm occurs every 24 hours until turned off, invoking INT 4A each

    time

    the BIOS does not check for invalid values for the time, so the CMOS

    clock chip''s "don''t care" setting (any values between C0h and FFh)

    may be used for any or all three parts.  For example, to create an

    alarm once a minute, every minute, call with CH=FFh, CL=FFh, and

    DH=00h.'
  bugs: []
