- entry_type: INT
  id: s-1A83
  category: s
  title: Tandy 2500, Tandy 1000L series - START PLAYING DIGITAL SOUND
  source: INTERRUP.D:6494
  interrupt: 1A
  flags: []
  function: '83'
  input_registers:
  - reg: AH
    operator: '='
    value: 83h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: volume (0=silence, 7=highest)
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: number of bytes to play
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    description: time between sound samples (multiples of 273 nanoseconds)
    table_refs: []
    sub_values: []
  - reg: ES:BX
    operator: ->
    description: sound data (array of 8-bit unsigned PCM samples)
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AH
      operator: '='
      value: 00h
      table_refs: []
      sub_values: []
    raw_lines: []
  - condition: CF set
    condition_description: if sound is busy
    registers: []
    raw_lines: []
  - condition: CF clear
    condition_description: if sound chip is free
    registers: []
    raw_lines: []
  notes:
  - 'this call returns immediately while the sound plays in the

    background; the sound chip is clocked at 3.57 MHz, with the low 12

    bits of DX specifying the clock divisor

    The BIOS appears to call INT 15/AX=91FBh when the sound device

    underflows to allow another INT 1A/AH=83h for seamless playing of

    long sounds.'
  bugs: []
