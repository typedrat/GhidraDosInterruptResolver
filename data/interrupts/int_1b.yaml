entries:
- entry_type: INT
  id: B-1B
  category: B
  title: KEYBOARD - CONTROL-BREAK HANDLER
  source: INTERRUP.E:9719
  interrupt: 1B
  flags:
  - C
  input_registers: []
  returns: []
  description: 'this interrupt is automatically called when INT 09 determines that

    Control-Break has been pressed'
  notes:
  - 'normally points to a short routine in DOS which sets the Ctrl-C flag,

    thus invoking INT 23h the next time DOS checks for Ctrl-C.'
