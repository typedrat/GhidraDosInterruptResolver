- entry_type: INT
  id: B-1F
  category: B
  title: SYSTEM DATA - 8x8 GRAPHICS FONT
  source: INTERRUP.E:9808
  interrupt: 1F
  flags: []
  input_registers: []
  returns: []
  description: 'this vector points at 1024 bytes of graphics data, 8 bytes for each

    character 80h-FFh'
  notes:
  - 'graphics data for characters 00h-7Fh stored at F000h:FA6Eh in 100%

    compatible BIOSes

    Under PhysTechSoft''s PTS ROM-DOS this table is fictitious.'
