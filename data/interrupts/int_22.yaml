file_type: interrupt
key: '22'
entries:
- entry_type: INT
  id: D-22
  category: D
  title: DOS 1+ - PROGRAM TERMINATION ADDRESS
  source: INTERRUP.J:8861
  interrupt: '22'
  flags: []
  input_registers: []
  returns: []
  description: 'this vector specifies the address of the routine which is to be given

    control after a program is terminated; it should never be called

    directly, since it does not point at an interrupt handler'
  notes:
  - 'this vector is restored from the DWORD at offset 0Ah in the PSP during

    termination, and then a FAR JMP is performed to the address in INT 22

    normally points at the instruction immediately following INT 21/AH=4Bh

    call which loaded the current program'
