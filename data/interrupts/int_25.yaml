- entry_type: INT
  id: k-25CDCD
  category: k
  title: Stacker - GET DEVICE DRIVER ADDRESS
  source: INTERRUP.J:9125
  interrupt: '25'
  flags: []
  function: CDCD
  input_registers:
  - reg: AX
    operator: '='
    value: CDCDh
    table_refs: []
    sub_values: []
  - reg: DS:BX
    operator: ->
    description: 'buffer for address (see #02549)'
    table_refs:
    - 02549
    sub_values: []
  - reg: CX
    operator: '='
    value: 0001h
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    value: 0000h
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      value: CDCDh
      description: if Stacker installed
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'not supported by Stacker Anywhere; to obtain the Stacker device

    driver address and to detect drives controlled by all versions

    of Stacker, INT 21/AX=4404h"Stacker" or lookup via the CDS and DPB

    should be preferred (see INT 21/AH=52h)

    Stacker Anywhere does not link its built-in device driver into

    the standard device driver chain, but it can be found via CDS/DPB'
  bugs: []
  see_also:
