file_type: interrupt
key: '26'
entries:
- entry_type: INT
  id: D-26
  category: D
  title: DOS 1+ - ABSOLUTE DISK WRITE (except partitions > 32M)
  source: INTERRUP.K:3
  interrupt: '26'
  flags: []
  input_registers:
  - reg: AL
    operator: '='
    description: drive number (00h = A:, 01h = B:, etc)
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: number of sectors to write (not FFFFh)
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    description: starting logical sector number (0000h - highest sector on drive)
    table_refs: []
    sub_values: []
  - reg: DS:BX
    operator: ->
    description: data to write
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers: []
    raw_lines: []
  - condition: CF set
    condition_description: on error
    registers:
    - reg: AH
      operator: '='
      description: 'status (see #02547)'
      table_refs:
      - '02547'
      sub_values: []
    - reg: AL
      operator: '='
      description: error code (same as passed to INT 24 in DI)
      table_refs: []
      sub_values: []
    - reg: AX
      operator: '='
      value: 0207h
      description: if more than 64K sectors on drive -- use new-style call
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'original flags are left on stack, and must be popped by caller

    this call bypasses the DOS filesystem, though DOS 5+ invalidates any

    disk buffers referencing sectors which are written with this call

    examination of CPWIN386.CPL indicates that if this call fails with

    error 0408h on an old-style (<32M) call, one should retry the

    call with the high bit of the drive number in AL set

    Novell DOS 7 decides whether the old-style or new-style (>32M) version

    of INT 26 must be used solely on the basis of the partition''s size,

    thus forcing use of the new-style call even for data in the first

    32M of the partition

    Windows98 will display an error message and deliberately hang the

    system on attempted write to any hard disk if neither bit 7 of the

    Extended Drive Info byte nor bit 6 of "DOS_FLAG" (List-of-Lists+60h)

    is set

    Although all registers except segment registers may be destroyed

    some software depends on some of the registers being preserved.

    For example some Flash disk drivers requires that DX is not trashed.

    DR-DOS 7.03 takes care of this.'
  bugs:
  - 'DOS 3.1 through 3.3 set the word at ES:[BP+1Eh] to FFFFh if AL is an

    invalid drive number

    DR DOS 3.41 will return with a jump instead of RETF, leaving the

    wrong number of bytes on the stack; use the huge-partition version

    (INT 26/CX=FFFFh) for all partition sizes under DR DOS 3.41

    DR DOS 6.0 original releases 05/1991 & 08/1991 reported wrong error

    codes for "drive not ready" and "write protect". This was fixed

    with the DR DOS BDOS patch "PAT321" (1992/02/19, XDIR /C: 947Bh)

    and later "full" rebuilds (see INT21/AX=4452h for details).'
  see_also:
  - type: interrupt
    interrupt: '13'
    params:
      AH: 03h
  - type: interrupt
    interrupt: '25'
    params: {}
  - type: interrupt
    interrupt: '26'
    params:
      CX: FFFFh
  - type: interrupt
    interrupt: '21'
    params:
      AX: 7305h
  - type: interrupt
    interrupt: '21'
    params:
      AH: 91h
    name: PTS
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: D-26CXFFFF
  category: D
  title: DOS 3.31+ - ABSOLUTE DISK WRITE (32M-2047M hard-disk partition)
  source: INTERRUP.K:43
  interrupt: '26'
  flags: []
  function: CXFFFF
  input_registers:
  - reg: CX
    operator: '='
    value: FFFFh
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: drive number (0=A, 1=B, etc)
    table_refs: []
    sub_values: []
  - reg: DS:BX
    operator: ->
    description: 'disk write packet (see #02552)'
    table_refs:
    - '02552'
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers: []
    raw_lines: []
  - condition: CF set
    condition_description: on error
    registers:
    - reg: AH
      operator: '='
      description: 'status (see #02547)'
      table_refs:
      - '02547'
      sub_values: []
    - reg: AL
      operator: '='
      description: error code (same as passed to INT 24 in DI)
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'partition is potentially >32M (and requires this form of the call) if

    bit 1 of the device attribute word in the device driver is set

    original flags are left on stack, and must be removed by caller

    this call bypasses the DOS filesystem, though DOS 5+ invalidates any

    disk buffers referencing sectors which are written with this call

    for FAT32 drives (which may be up to 2TB in size), use INT 21/AX=7305h

    Windows98 will display an error message and deliberately hang the

    system on attempted write to any hard disk if neither bit 7 of the

    Extended Drive Info byte nor bit 6 of "DOS_FLAG" (List-of-Lists+60h)

    is set'
  bugs: []
  see_also:
