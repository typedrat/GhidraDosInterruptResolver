file_type: interrupt
key: '27'
entries:
- entry_type: INT
  id: D-27
  category: D
  title: DOS 1+ - TERMINATE AND STAY RESIDENT
  source: INTERRUP.K:76
  interrupt: '27'
  flags: []
  input_registers:
  - reg: DX
    operator: '='
    description: number of bytes to keep resident (max FFF0h)
    table_refs: []
    sub_values: []
  - reg: CS
    operator: '='
    description: segment of PSP
    table_refs: []
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - never
  notes:
  - 'this is an obsolete call

    INT 22, INT 23, and INT 24 are restored from the PSP

    does not close any open files

    the minimum number of bytes which will remain resident is 110h for

    DOS 2.x and 60h for DOS 3.0+; there is no minimum for DOS 1.x, which

    implements this service in COMMAND.COM rather than the DOS kernel'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '21'
    params:
      AH: 31h
  index: []
  tables: []
  table_refs: []
