    - reg: ES
      operator: '='
      description: segment of PCXDUMP's memory block (v9.30, undocumented)
      table_refs: []
      sub_values: []
    raw_lines: []
  program: PCXDUMP is a shareware screen grabber saving in PCX format
  notes:
  - 'if DL<>00h a dump can be requested by calling INT DL as shown

    below (the user can choose the interrupt number at installation

    time); if DL=00h the dump function can be called only by hotkeys

    (this is the default)'
  bugs: []
