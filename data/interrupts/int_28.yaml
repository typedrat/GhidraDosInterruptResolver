file_type: interrupt
key: '28'
entries:
- entry_type: INT
  id: D-28
  category: D
  title: DOS 2+ - DOS IDLE INTERRUPT
  source: INTERRUP.K:95
  interrupt: '28'
  flags:
  - C
  input_registers:
  - reg: SS:SP
    operator: '='
    description: top of MS-DOS stack for I/O functions
    table_refs: []
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - all registers preserved
  description: "This interrupt is invoked each time one of the DOS character input\nfunctions loops while waiting for input.\
    \  Since a DOS call is in\nprogress even though DOS is actually idle during such input waits,\nhooking this function is\
    \ necessary to allow a TSR to perform DOS\ncalls while the foreground program is waiting for user input.\t The\nINT 28h\
    \ handler may invoke any INT 21h function except functions\n00h through 0Ch."
  notes:
  - 'under DOS 2.x, the critical error flag (the byte immediately after the

    InDOS flag) must be set in order to call DOS functions 50h/51h from

    the INT 28h handler without destroying the DOS stacks.

    calls to INT 21/AH=3Fh,40h from within an INT 28 handler may not use a

    handle which refers to CON

    at the time of the call, the InDOS flag (see INT 21/AH=34h) is normally

    set to 01h; if larger, DOS is truly busy and should not be reentered

    the default handler is an IRET instruction

    supported in OS/2 compatibility box

    the _MS-DOS_Programmer''s_Reference_ for DOS 5.0 incorrectly documents

    this interrupt as superseded

    the performance of NetWare Lite servers (and probably other peer-to-

    peer networks) can be dramatically improved by calling INT 28

    frequently from an application''s idle loop'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '21'
    params:
      AH: 34h
  - type: interrupt
    interrupt: 2A
    params:
      AH: 84h
  - type: interrupt
    interrupt: 2F
    params:
      AX: 1680h
  index: []
  tables: []
  table_refs: []
