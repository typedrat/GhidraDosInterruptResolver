- entry_type: INT
  id: P-2A8700
  category: P
  title: PRINT - BEGIN BACKGROUND PRINTING
  source: INTERRUP.K:461
  interrupt: 2A
  flags:
  - C
  - U
  function: '8700'
  input_registers:
  - reg: AX
    operator: '='
    value: 8700h
    table_refs: []
    sub_values: []
  - reg: CF
    operator: clear
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if OK to print in background now
    registers: []
    raw_lines: []
  - condition: CF set
    condition_description: if background printing not allowed at this time
    registers: []
    raw_lines: []
  description: 'used to inform interested programs that PRINT is about to start its

    background processing, and allow those programs to postpone the

    processing if necessary'
  notes:
  - 'when PRINT gains control and wants to begin printing, it calls this

    function.  If CF is clear on return, PRINT begins its background

    processing, and calls AX=8701h when it is done.  If CF is set on

    return, PRINT will relinquish control immediately, and will not

    call AX=8701h

    PCVENUS (an early network shell by IBM and CMU) hooks this call to

    prevent background printing while its own code is active'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AH: 80h
  - type: interrupt
    params:
      AH: 81h
  - type: interrupt
    params:
      AX: 8701h
  index: []
