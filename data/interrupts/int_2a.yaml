- entry_type: INT
  id: N-2A0300
  category: N
  title: NETWORK - CHECK DIRECT I/O
  source: INTERRUP.K:206
  interrupt: 2A
  flags: []
  function: '0300'
  input_registers:
  - reg: AX
    operator: '='
    value: 0300h
    table_refs: []
    sub_values: []
  - reg: DS:SI
    operator: ->
    description: ASCIZ device name (may be full path or only drive specifier--
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if direct physical addressing (INT 13,INT 25) permissible
    registers: []
    raw_lines: []
  - condition: CF set
    condition_description: if access via files only
    registers: []
    raw_lines: []
  notes:
  - 'do not use direct disk accesses if this function returns CF set or the

    device is redirected (INT 21/AX=5F02h)

    use AH=00h to determine whether the network is installed; if not,

    direct physical access is allowed

    may take some time to execute, so programs which need to check

    frequently should save the result of the first call

    this function is called by the DOS kernel on INT 25 and INT 26

    supported by PC LAN Program, LAN Manage, LANtastic, NetWare, 10NET,

    etc.'
  bugs: []
  see_also:
