- entry_type: INT
  id: D-2A80
  category: D
  title: NETWORK - BEGIN DOS CRITICAL SECTION
  source: INTERRUP.K:388
  interrupt: 2A
  flags:
  - C
  - U
  function: '80'
  input_registers:
  - reg: AH
    operator: '='
    value: 80h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: 'critical section number (00h-0Fh) (see #02555)'
    table_refs:
    - '02555'
    sub_values: []
  returns: []
  notes:
  - "normally hooked to avoid interrupting a critical section, rather than\ncalled\nthe handler should ensure that none of\
    \ the critical sections are\nreentered, usually by suspending a task which attempts to reenter\nan active critical section\n\
    the DOS kernel does not invoke critical sections 01h and 02h unless it\nis patched.  DOS 3.1+ contains a zero-terminated\
    \ list of words\nbeginning at offset -11 from the Swappable Data Area\n(see #01687 at INT 21/AX=5D06h); each word contains\
    \ the offset within\nthe DOS data segment of a byte which must be changed from C3h (RET)\nto 50h (PUSH AX) under DOS 3.x\
    \ or from 00h to a nonzero value under\nDOS 4.0+ to enable use of critical sections.\tFor DOS 4.0+, all\nwords in this\
    \ list point at the byte at offset 0D0Ch.\nMS Windows patches the DOS kernel's calls to INT 2A/AH=80h-81h into\nfar calls\
    \ to its own handler, and does not reflect the calls back\nto INT 2A unless SYSTEM.INI contains ReflectDOSInt2A=1 or\n\
    ModifyDOSInt2A=0 in the [386Enh] section\nNovell NETX does not issue INT 2A/AH=80h and INT 2A/AH=81h calls when\nit intercepts\
    \ INT 21 calls and processes them itself"
  bugs: []
  see_also:
  - type: interrupt
    params:
      AH: 81h
  - type: interrupt
    params:
      AH: 82h
  - type: interrupt
    params:
      AX: 8700h
  - type: interrupt
    interrupt: '21'
    params:
      AX: 5D06h
  - type: interrupt
    interrupt: '21'
    params:
      AX: 5D0Bh
  index: []
  tables:
  - '02555'
  table_refs:
  - 01687
- entry_type: INT
  id: D-2A81
  category: D
  title: NETWORK - END DOS CRITICAL SECTION
  source: INTERRUP.K:426
  interrupt: 2A
  flags:
  - C
  - U
  function: '81'
  input_registers:
  - reg: AH
    operator: '='
    value: 81h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: 'critical section number (00h-0Fh) (see #02555)'
    table_refs:
    - '02555'
    sub_values: []
  returns: []
  notes:
  - 'normally hooked rather than called

    the handler should reawaken any tasks which were suspended due to an

    attempt to enter the specified critical section

    MS Windows patches the DOS kernel''s calls to INT 2A/AH=80h-81h into

    far calls to its own handler, and does not reflect the calls back

    to INT 2A unless SYSTEM.INI contains ReflectDOSInt2A=1 or

    ModifyDOSInt2A=0 in the [386Enh] section'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AH: 80h
  - type: interrupt
    params:
      AH: 82h
  - type: interrupt
    params:
      AX: 8700h
  index: []
  tables: []
  table_refs: []
