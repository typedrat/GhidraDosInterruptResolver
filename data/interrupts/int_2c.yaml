- entry_type: INT
  id: m-2C0009
  category: m
  title: Cloaking - SET PASSALONG ADDRESS
  source: INTERRUP.K:787
  interrupt: 2C
  flags:
  - P
  function: 0009
  input_registers:
  - reg: AX
    operator: '='
    value: 0009h
    table_refs: []
    sub_values: []
  - reg: DX:EBX
    operator: '='
    description: 'new value for passalong address (see #02558)'
    table_refs:
    - 02558
    sub_values: []
  returns:
  - condition: CF clear
    registers: []
    raw_lines: []
  notes:
  - "when an INT 2C instruction is executed in V86 mode, the Cloaking host\ncalls the passalong address.\tThe handler should\
    \ check whether the\nupcall is of interest to it, and if not it should jump to the old\npassalong address (retrieved with\
    \ AX=0008h before the handler was\ninstalled).  The final handler should return with CF clear to cause\nthe interrupt\
    \ to be reflected back to V86 mode if none of the\npassalong handlers is triggered\nthis function was first introduced\
    \ with RM386 (RAM-MAN/386) v6.00"
  bugs: []
  see_also:
