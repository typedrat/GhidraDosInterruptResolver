- entry_type: INT
  id: t-2D
  category: t
  title: ALTERNATE MULTIPLEX INTERRUPT SPECIFICATION (AMIS) [v3.6]
  source: INTERRUP.K:1244
  interrupt: 2D
  flags: []
  input_registers:
  - reg: AH
    operator: '='
    description: multiplex number
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: function
    table_refs: []
    sub_values:
    - value: 00h
      description: installation check
      sub_values: []
    - value: 01h
      description: get private entry point
      sub_values: []
    - value: 02h
      description: uninstall
      sub_values: []
    - value: 03h
      description: request popup
      sub_values: []
    - value: 04h
      description: determine chained interrupts
      sub_values: []
    - value: 05h
      description: get hotkey list
      sub_values: []
    - value: 06h
      description: 'get device-driver information 07h-0Fh reserved for future enhancements Return: AL = 00h (not implemented)
        other  application-dependent'
      sub_values: []
  returns:
  - registers: []
    raw_lines:
    - varies by function
  notes:
  - "programs should not use fixed multiplex numbers; rather, a program\nshould scan all multiplex numbers from 00h to FFh,\
    \ remembering the\nfirst unused multiplex in case the program is not yet installed.\nFor multiplex numbers which are in\
    \ use, the program should compare\nthe first 16 bytes of the signature string to determine whether it\nis already installed\
    \ on that multiplex number.  If not previously\ninstalled, it should use the first free multiplex number.\nfunctions other\
    \ than 00h are not valid unless a program is installed\non the selected multiplex number\nto be considered fully compliant\
    \ with version 3.6 of the specification,\nprograms must implement at least functions 00h, 02h (no resident\nuninstall\
    \ code required), and 04h (return value 04h).\t TSRs that\nprovide hotkeys with which the user can activate them must\
    \ also\nimplement function 05h.  TSRs which provide DOS device drivers must\nalso implement function 06h.\tThe absolute\
    \ minimum fully-compliant\nimplementation has an overhead of 64 bytes (80 bytes with function\n05h) plus 22 bytes per\
    \ hooked interrupt (for the interrupt sharing\nprotocol header and hook list entry).\nthe signature string and description\
    \ may be used by memory mappers\nto display the installed programs\nto be considered fully compliant, users of this specification\
    \ must\nadhere to the IBM interrupt sharing protocol (see #02568), which will\npermit removal of TSRs in arbitrary order\
    \ and interrupt handler\nreordering.  All TSRs following this specification should be\nremovable unless they are loaded\
    \ from CONFIG.SYS, though they need\nnot keep the code for removing themselves resident; it is acceptable\nfor a separate\
    \ program to perform the interrupt unhooking and\nmemory-freeing steps of removal.\nA sample public-domain implementation\
    \ including example TSRs and\nutility programs may be found in a separate package distributed as\nAMISLnnn.ZIP (AMISL092.ZIP\
    \ as of this writing).\nPlease let me know if you choose to follow this proposal.  The\nsignature and a list of the private\
    \ API calls you use would be\nappreciated, as well."
  bugs: []
  see_also:
  - type: interrupt
    interrupt: 2D
    params:
      AL: 00h
  - type: interrupt
    interrupt: 2D
    params:
      AL: 01h
  - type: interrupt
