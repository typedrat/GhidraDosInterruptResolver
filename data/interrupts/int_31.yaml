    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers: []
    raw_lines:
    - real mode call structure modified (all fields except SS:SP, CS:IP
    - filled with return values from real mode interrupt)
  - condition: CF set
    condition_description: on error
    registers:
