- entry_type: INT
  id: E-310000
  category: E
  title: DPMI 0.9+ - ALLOCATE LDT DESCRIPTORS
  source: INTERRUP.N:3289
  interrupt: '31'
  flags:
  - P
  function: '0000'
  input_registers:
  - reg: AX
    operator: '='
    value: 0000h
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: number of descriptors to allocate
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers:
    - reg: AX
      operator: '='
      description: base selector
      table_refs: []
      sub_values: []
    raw_lines: []
  - condition: CF set
    condition_description: on error
    registers:
    - reg: AX
      operator: '='
      description: 'error code (DPMI 1.0+) (see #03143)'
      table_refs:
      - '03143'
      sub_values: []
    raw_lines: []
  notes:
  - 'DPMI is the DOS Protected-Mode Interface

    the base and limit of the returned descriptors will be 0, and the type

    will be "data"

    add the value returned by INT 31/AX=0003h to move to subsequent

    descriptors if multiple descriptors were allocated

    not supported by MS Windows 3.0 in Standard mode'
  bugs: []
  see_also:
