- entry_type: INT
  id: v-31
  category: v
  title: VIRUS - "Vacsina" series - INSTALLATION CHECK (NOT A VECTOR!)
  source: INTERRUP.N:3282
  interrupt: '31'
  flags: []
  input_registers: []
  returns: []
  notes:
  - 'if one of the Vacsina viruses is resident, the low byte of this

    interrupt still contains the last byte of the INT 30 CP/M JMP

    instruction, but the remaining three bytes are 7Fh 39h followed

    by the Vacsina version number'
  bugs: []
