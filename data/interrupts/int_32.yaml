- entry_type: INT
  id: y-326E11
  category: y
  title: NOISE.SYS v0.53+ - GET ENTROPY ESTIMATE
  source: INTERRUP.N:5205
  interrupt: '32'
  flags: []
  function: 6E11
  input_registers:
  - reg: AX
    operator: '='
    value: 6E11h
    table_refs: []
    sub_values: []
  returns:
  - condition: CF set
    condition_description: on error
    registers:
    - reg: AL
      operator: '='
      description: 'error code (00h,FDh,FEh) (see #03166)'
      table_refs:
      - '03166'
      sub_values: []
    raw_lines: []
  - condition: CF clear
    condition_description: if successful
    registers:
    - reg: EBX
      operator: '='
      description: estimated bit count (refer to note below)
      table_refs: []
      sub_values: []
    - reg: CL
      operator: '='
      description: FRACBITS (number of fractional bits)
      table_refs: []
      sub_values: []
    - reg: EDX
      operator: '='
      description: low 32-bits of total number of samples added
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'the estimated number of fresh random bits is equal to

    (EAX >> FRACBITS) + ((EAX & ((1 << FRACBITS)-1) / (1 << FRACBITS))'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AH: 6Eh
  - type: interrupt
    params:
      AX: 6E00h
  index: []
  tables: []
  table_refs: []
