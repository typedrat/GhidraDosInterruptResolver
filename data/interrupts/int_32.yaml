- entry_type: INT
  id: y-326E
  category: y
  title: NOISE.SYS 0.53 - API
  source: INTERRUP.N:5139
  interrupt: '32'
  flags: []
  function: 6E
  input_registers:
  - reg: AH
    operator: '='
    value: 6Eh
    description: (function ID)
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: subfunction (see INT 32/AX=6E00h)
    table_refs: []
    sub_values: []
  returns:
  - condition: CF set
    condition_description: on error
    registers:
    - reg: AL
      operator: '='
      description: 'error code (see #03166)'
      table_refs:
      - '03166'
      sub_values: []
    raw_lines: []
  - condition: CF clear
    condition_description: if successful
    registers: []
    raw_lines: []
  notes:
  - 'INT 32 is only a proposed interface for NOISE.SYS. Use the IOCTL READ

    from the RANDOM device to determine the interrupt and function ID

    used by the driver, since future versions may use the Alternate

    Multiplex Interrupt (AMIS) at INT 2Dh.

    the beta v0.51 had a substantially different API on INT 32/AH=6Eh'
  bugs: []
  see_also: []
  index: []
  tables:
  - '03166'
  table_refs: []
