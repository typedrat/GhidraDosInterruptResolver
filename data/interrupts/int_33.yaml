- entry_type: INT
  id: M-330000
  category: M
  title: MS MOUSE - RESET DRIVER AND READ STATUS
  source: INTERRUP.N:5306
  interrupt: '33'
  flags: []
  function: '0000'
  input_registers:
  - reg: AX
    operator: '='
    value: 0000h
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      description: status
      table_refs: []
      sub_values: []
    - reg: BX
      operator: '='
      description: number of buttons
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - "since INT 33 might be uninitialized on old machines, the caller\nshould first check that INT 33 is neither 0000h:0000h\
    \ nor points at\nan IRET instruction (BYTE CFh) before calling this API\nto use mouse on a Hercules-compatible monographics\
    \ card in graphics\nmode, you must first set 0040h:0049h to 6 for page 0 or 5 for page 1,\nand then call this function.\t\
    Logitech drivers v5.01 and v6.00\nreportedly do not correctly use Hercules graphics in dual-monitor\nsystems, while version\
    \ 4.10 does.\nthe Logitech mouse driver contains the signature string \"LOGITECH\"\nthree bytes past the interrupt handler;\
    \ many of the Logitech mouse\nutilities check for this signature.\nLogitech MouseWare v6.30 reportedly does not support\
    \ CGA video modes\nif no CGA is present when it is started and the video board is\nlater switched into CGA emulation"
  bugs: []
  see_also:
  - type: interrupt
    params:
      AX: 0011h
  - type: interrupt
    params:
      AX: 0021h
  - type: interrupt
    params:
      AX: 002Fh
  - type: interrupt
    interrupt: '62'
    params:
      AX: 007Ah
  - type: interrupt
    interrupt: '74'
    params: {}
  index: []
  tables: []
