- entry_type: INT
  id: M-330009
  category: M
  title: MS MOUSE v3.0+ - DEFINE GRAPHICS CURSOR
  source: INTERRUP.N:5414
  interrupt: '33'
  flags: []
  function: 0009
  input_registers:
  - reg: AX
    operator: '='
    value: 0009h
    table_refs: []
    sub_values: []
  - reg: BX
    operator: '='
    description: column of cursor hot spot in bitmap (-16 to 16)
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: row of cursor hot spot (-16 to 16)
    table_refs: []
    sub_values: []
  - reg: ES:DX
    operator: ->
    description: 'mask bitmap (see #03170)'
    table_refs:
    - '03170'
    sub_values: []
  returns: []
  notes:
  - 'in graphics modes, the screen contents around the current mouse cursor

    position are ANDed with the screen mask and then XORed with the

    cursor mask

    the Microsoft mouse driver v7.04 and v8.20 uses only BL and CL, so the

    hot spot row/column should be limited to -128..127

    Microsoft KnowledgeBase article Q19850 states that the high bit is

    right-most, but that statement is contradicted by all other available

    documentation'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AX: 000Ah
  - type: interrupt
    params:
      AX: 0012h
  - type: interrupt
    params:
      AX: 002Ah
  - type: interrupt
    interrupt: '62'
    params:
      AX: 007Fh
  - type: interrupt
    interrupt: 6F
    params:
      AH: 0Ah
    name: F_DEF_MASKS
  index: []
  tables:
  - '03170'
  table_refs: []
