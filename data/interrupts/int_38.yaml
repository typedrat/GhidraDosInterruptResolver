  title: FLOATING POINT EMULATION - OPCODE DCh
  source: INTERRUP.N:6830
  interrupt: '38'
  flags: []
  input_registers: []
  returns: []
  description: 'this interrupt is used to emulate floating-point instructions with

    an opcode of DCh'
