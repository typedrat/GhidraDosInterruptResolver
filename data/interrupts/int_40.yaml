  flags: []
  input_registers:
  - reg: AL
    operator: '='
    description: operation
    table_refs: []
    sub_values:
    - value: 00h
      description: close file
      sub_values: []
    - value: 40h
      description: open file for reading
      sub_values: []
    - value: 80h
      description: open file for writing
      sub_values: []
    - value: C0h
      description: open file for random access
