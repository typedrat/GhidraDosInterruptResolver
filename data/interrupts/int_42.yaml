- entry_type: INT
  id: V-425F33
  category: V
  title: Chips & Technologies '65530' BIOS - MODE SET HOOK
  source: INTERRUP.N:7188
  interrupt: '42'
  flags:
  - C
  function: 5F33
  input_registers:
  - reg: AX
    operator: '='
    value: 5F33h
    table_refs: []
    sub_values: []
  - reg: BL
    operator: '='
    description: current width in characters
    table_refs: []
    sub_values: []
  - reg: BH
    operator: '='
    description: curent video mode
    table_refs: []
    sub_values: []
  - reg: CH
    operator: '='
    description: active display page
    table_refs: []
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - nothing
  description: this function is called at the end of a video mode set
  notes:
  - 'the OEM has the option of enabling or disabling this callout, as well

    as specifying whether the callout occurs on INT 15h or INT 42h'
  bugs: []
