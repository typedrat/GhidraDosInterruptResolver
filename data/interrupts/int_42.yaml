- entry_type: INT
  id: V-427503
  category: V
  title: Toshiba laptops - GET DISPLAY STATUS
  source: INTERRUP.N:7220
  interrupt: '42'
  flags: []
  function: '7503'
  input_registers:
  - reg: AX
    operator: '='
    value: 7503h
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      value: 7575h
      description: if supported
      table_refs: []
      sub_values: []
    - reg: CX
      operator: '='
      value: 0001h
      description: if supported
      table_refs: []
      sub_values: []
    - reg: BH
      operator: '='
      description: display type (00h color, 03h monochrome)
      table_refs: []
      sub_values: []
    - reg: BL
      operator: '='
      description: display state
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'used by VCHAD.EXE and supported by all Toshiba VGA laptops until about

    1994 (string "TOSHIBA " at F000:E010h should be checked before call)

    no longer supported by T21xx series, use INT 10/AX=5F50h instead

    INT 42 normally points to F000:F065h but may be redirected by QEMM386'
  bugs: []
