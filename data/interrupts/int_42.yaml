  id: V-42
  category: V
  title: VIDEO - RELOCATED DEFAULT INT 10 VIDEO SERVICES (EGA,VGA)
  source: INTERRUP.N:7163
  interrupt: '42'
  flags: []
  input_registers: []
  returns: []
  description: 'contains the address of the original INT 10 handler which an EGA+

    video adapter replaces with its own on-board BIOS code'
  notes:
