- entry_type: INT
  id: O-4400
  category: O
  title: Acorn BBC Master 512 - "OSARGS" - GET/SET FILE PARAMS FOR OPEN FILE
  source: INTERRUP.N:7285
  interrupt: '44'
  flags: []
  function: '00'
  input_registers:
  - reg: AH
    operator: '='
    value: 00h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: function
    table_refs: []
    sub_values:
    - value: 00h
      description: 'get current filing system Return: AL = filing system (see #03200)'
      sub_values: []
    - value: 01h
      description: 'get address of commandline tail Return: BX buffer filled with address of command tail in I/O processor
        address space (use INT 4A/AL=05h to retrieve)'
      sub_values: []
    - value: FFh
      description: flush all files onto secondary storage
      sub_values: []
  - reg: BX
    operator: ->
    description: 4-byte data buffer
    table_refs: []
    sub_values: []
  returns: []
  notes:
  - the commandline tail is terminated with a carriage return (0Dh)
  bugs: []
