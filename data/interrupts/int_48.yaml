- entry_type: INT
  id: b-48
  category: b
  title: Western Digital WD1002-27X SuperBIOS - DRIVE DATA (NOT A VECTOR!)
  source: INTERRUP.N:7531
  interrupt: '48'
  flags: []
  input_registers: []
  returns: []
  notes:
  - 'the second WD1002-27X controller in a system uses the low byte to

    store the number of drives controlled by the second controller,

    and the high word for temporary storage during track recalculation;

    the first controller uses offsets 74h-77h in the BIOS data area

    (refer to MEMORY.LST) to store data'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '47'
    params: {}
    name: SuperBIOS
