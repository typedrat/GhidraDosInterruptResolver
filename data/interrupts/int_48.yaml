- entry_type: INT
  id: b-4800
  category: b
  title: TI Professional PC - SPEAKER DEVICE - SOUND SPEAKER
  source: INTERRUP.N:7574
  interrupt: '48'
  flags: []
  function: '00'
  input_registers:
  - reg: AH
    operator: '='
    value: 00h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: number of 25ms ticks sound should last
    table_refs: []
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - nothing
  description: 'sound the speaker at the current frequency setting (see AH=02h) for

    the indicated duration'
  notes:
  - 'this function returns immediately; the sound is terminated by the

    timer interrupt handler

    if a new sound is requested while one is already in progress, the

    previous sound is terminated immediately and the new sound takes

    its place'
