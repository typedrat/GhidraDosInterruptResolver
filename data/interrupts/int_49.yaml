- entry_type: INT
  id: a-490001
  category: a
  title: MAGic v1.16+ - TURN ON MAGNIFICATION
  source: INTERRUP.N:7727
  interrupt: '49'
  flags: []
  function: '0001'
  input_registers:
  - reg: AX
    operator: '='
    value: 0001h
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      description: 'status (see #03209)'
      table_refs:
      - 03209
      sub_values: []
    raw_lines: []
  program: 'MAGic (MAGnification In Color) is a TSR by Microsystems Software, Inc.

    providing 2x2 text and graphics magnification on VGA, XGA, and SVGA'
  notes:
  - "INT 49 is the default, but may be overridden on the commandline.  The\nactual interrupt in use may be found by searching\
    \ for the signature\n\"MAGic\" or \"xMAGic\" (for the deluxe version) immediately preceding\nthe interrupt handler (this\
    \ is also the installation check).\tMAGic\nuses CodeRunneR, which places the signature \"RT\" at offset 0000h in\nthe\
    \ interrupt handler's segment, followed by MAGic's TSR ID of\n\"VMAG\"."
  bugs: []
  see_also:
  - type: interrupt
    params:
      AX: 0002h
  - type: interrupt
    params:
      AX: 0003h
  - type: interrupt
    params:
      AX: 0004h
  - type: interrupt
    params:
      AX: 0008h
  index:
  - installation check;MAGic
  tables:
  - 03209
  table_refs: []
