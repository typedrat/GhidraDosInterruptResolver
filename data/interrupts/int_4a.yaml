  title: SYSTEM - USER ALARM HANDLER
  source: INTERRUP.N:8006
  interrupt: 4A
  flags:
  - C
  input_registers: []
  returns: []
  description: 'This interrupt is invoked by the BIOS when a real-time clock alarm

    occurs; an application may use it to perform an action at a

    predetermined time.'
  notes:
  - 'this interrupt is called from within a hardware interrupt handler,

    so all usual precautions against reentering DOS must be taken'
