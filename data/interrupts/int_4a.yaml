- entry_type: INT
  id: b-4A04
  category: b
  title: TI Professional PC - KEYBOARD - SEND COMMAND TO KEYBOARD
  source: INTERRUP.N:8090
  interrupt: 4A
  flags: []
  function: '04'
  input_registers:
  - reg: AH
    operator: '='
    value: 04h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: command
    table_refs: []
    sub_values:
    - value: 00h
      description: reset to default states
      sub_values: []
    - value: 01h
      description: enable auto-repeat (default)
      sub_values: []
    - value: 02h
      description: disable auto-repeat
      sub_values: []
    - value: 03h
      description: lock keyboard
      sub_values: []
    - value: 04h
      description: unlock keyboard (default)
      sub_values: []
    - value: 05h
      description: enable keyclick (requires hardware modification to work)
      sub_values: []
    - value: 06h
      description: disable keyclick (default)
      sub_values: []
  returns:
