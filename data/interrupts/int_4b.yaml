- entry_type: INT
  id: d-4B8103
  category: d
  title: Virtual DMA Specification - LOCK DMA REGION
  source: INTERRUP.N:8387
  interrupt: 4B
  flags: []
  function: '8103'
  input_registers:
  - reg: AX
    operator: '='
    value: 8103h
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    description: 'flags (see #03220)'
    table_refs:
    - '03220'
    sub_values: []
  - reg: ES:DI
    operator: ->
    description: 'DMA descriptor structure (see #03221,#03222,#03223)'
    table_refs:
    - '03221'
    - '03222'
    - '03223'
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers: []
    raw_lines:
    - DDS physical address field filled in
    - DDS buffer ID field filled (0000h if no buffer allocated)
  - condition: CF set
    condition_description: on error
    registers:
    - reg: AL
      operator: '='
      description: 'error code (see #03218)'
      table_refs:
      - 03218
      sub_values: []
    raw_lines: []
  notes: []
  bugs:
  - 'Windows 3.0 does not correctly support automatic remapping or copying

    in enhanced mode

    Windows 3.0 in enhanced mode does not return a correct code on error'
  see_also:
  - type: interrupt
    params:
      AX: 8104h
  - type: interrupt
    params:
      AX: 8105h
  index: []
  tables:
  - '03220'
  - '03221'
  - '03222'
  - '03223'
  table_refs: []
