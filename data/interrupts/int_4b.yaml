- entry_type: INT
  id: d-4B
  category: d
  title: Common Access Method SCSI interface (draft revision 1.9)
  source: INTERRUP.N:8243
  interrupt: 4B
  flags: []
  input_registers:
  - reg: ES:DI
    operator: ->
    description: 'CAM Control Block (see #03229 at INT 4F/AX=8100h)'
    table_refs:
    - 03229
    sub_values: []
  returns: []
  notes:
  - 'the CAM committee moved the interface to INT 4F after revision 1.9

    to avoid conflicting with the IBM SCSI interface and the Virtual

    DMA specification

    the only driver to date reported to use the CAM interface on INT 4B

    instead of INT 4F is from Future Domain (which has drivers for CAM

    on either interrupt)'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: 4F
    params:
      AX: 8100h
  install_check: 'test for the string "SCSI_CAM" eight bytes past the INT 4Bh

    handler'
  index:
  - installation check;Common Access Method SCSI interface
  tables: []
  table_refs: []
