  input_registers:
  - reg: AH
    operator: '='
    value: 01h
    table_refs: []
    sub_values: []
  - reg: DL
    operator: '='
    description: drive (bit 7 set for hard disk)
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if status unchanged
    registers: []
    raw_lines: []
  - condition: CF set
    condition_description: if status changed since last call
    registers:
    - reg: AH
      operator: '='
      value: 00h
      table_refs: []
      sub_values: []
    - reg: AL
      operator: '='
      description: 'status of previous operation (see #00234 at INT 13/AH=01h)'
      table_refs:
      - '00234'
      sub_values: []
    raw_lines: []
  notes:
  - 'this function is nearly the same as INT 13/AH=01h on a standard PC BIOS

    the TI''s BIOS tranparently performs a number of retries, and an error

    status is only reported if all of the retries fail.  To get the error

    status if the operation succeeded on a retry, use AH=07h instead'
