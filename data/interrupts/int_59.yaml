- entry_type: INT
  id: b-59
  category: b
  title: TI Professional PC - COMMON ROM HARDWARE INTERRUPT EXIT VECTOR
  source: INTERRUP.O:218
  interrupt: '59'
  flags: []
  input_registers: []
  returns: []
  description: 'all hardware interrupts on the TI Pro jump indirectly to the handler

    pointed at by this interrupt vector to finish their handling of

    the hardware interrupt'
  notes:
  - 'the default handler decrements the interrupt count, restores registers

    (including the stack pointer), sends an EOI to the interrupt

    controller, and finally does an IRET

    can be used by multitaskers which need to get control after every

    hardware interrupt'
  bugs: []
