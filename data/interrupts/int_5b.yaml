- entry_type: INT
  id: b-5B
  category: b
  title: TI Professional PC - KEYBOARD MAPPING HOOK
  source: INTERRUP.O:342
  interrupt: 5B
  flags:
  - C
  input_registers:
  - reg: CF
    operator: set
    table_refs: []
    sub_values: []
  - reg: AH
    operator: '='
    description: 'shift state (see #03247)'
    table_refs:
    - '03247'
    sub_values: []
  - reg: AL
    operator: '='
    description: 'scan code (see #03214)'
    table_refs:
    - '03214'
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - BX, CX, DI, ES may be destroyed
    - 'various return methods are supported:'
    - 'IRET, AX unchanged: process keystroke normally'
    - 'IRET, AL = FFh: discard keystroke'
    - 'IRET, AX changed: process modified keystroke'
    - 'chain to old INT 5B: allow other handlers to look at (possibly'
    - modified) keystroke in AX
    - 'RETF 2, CF clear: place returned AX into keyboard buffer without'
    - any further processing
  notes:
  - 'invoked by the keyboard ISR, and used to remap the keyboard

    if CF is clear on entry, some other handler has processed the

    keystroke and the current handler should not modify it, instead

    performing a RETF 2 or IRET (after clearing CF on the stack)

    when requesting that a value be placed directly into the keyboard

    buffer, AL and AH may not *both* be nonzero (the TI does not

    return scan codes as part of the key code for non-extended keys)'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '15'
    params:
      AH: 4Fh
  - type: interrupt
    interrupt: 4A
    params:
      AH: 00h
    name: TI
  - type: interrupt
    interrupt: '59'
    params: {}
    name: TI Professional
  - type: interrupt
    interrupt: 5C
    params: {}
    name: TI Professional
  - type: interrupt
    interrupt: 5D
    params: {}
    name: TI Professional
  - type: interrupt
    interrupt: 5E
    params: {}
    name: TI Professional
  - type: interrupt
    interrupt: 5F
    params: {}
    name: TI Professional
  index: []
  tables:
  - '03247'
  table_refs: []
