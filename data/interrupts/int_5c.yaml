- entry_type: INT
  id: b-5C0100
  category: b
  title: TI Professional PC - KEYBOARD PAUSE KEY VECTOR
  source: INTERRUP.O:816
  interrupt: 5C
  flags:
  - C
  function: '0100'
  input_registers:
  - reg: AX
    operator: '='
    value: 0100h
    table_refs: []
    sub_values: []
  - reg: CF
    operator: clear
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    registers:
    - reg: AX
      operator: '='
      description: keystroke to be placed into keyboard buffer
      table_refs: []
      sub_values: []
    raw_lines: []
  - condition: CF set
    registers: []
    raw_lines:
    - AX ignored
  description: 'toggle a pause flag which is checked by the CRT Device Service Routine

    (see INT 49/AH=01h"TI") and causes it to temporarily halt the

    machine on the next video-related function (until a key is pressed)'
  notes: []
  bugs: []
