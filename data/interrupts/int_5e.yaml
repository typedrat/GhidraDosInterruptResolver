- entry_type: INT
  id: b-5E
  category: b
  title: TI Professional PC - KEYBOARD PRINT-SCREEN VECTOR
  source: INTERRUP.O:865
  interrupt: 5E
  flags:
  - C
  input_registers:
  - reg: CF
    operator: set
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    registers:
    - reg: AX
      operator: '='
      description: keystroke to be placed into keyboard buffer
      table_refs: []
      sub_values: []
    raw_lines: []
  - condition: CF set
    registers: []
    raw_lines:
    - AX ignored
  description: hook to dump the screen to the printer
  notes:
  - 'hooked by TI MS-DOS, which provides a PRTSCRN character device which

    can invoke screen prints when a decimal digit (indicating the type

    of screen dump) is written to it

    the TI MS-DOS print-screen routine allows selective dumps of text

    only, graphics only, or text and graphics superimposed, in either

    normal or reverse, by pressing the appropriate keystroke combination:

    Shift-Print, Ctrl-Print, Alt-Print, Shift-Alt-Print, Ctrl-Alt-Print,

    or Shift-Ctrl-Print.

    the BIOS default routine for this vector is an IRET'
  bugs: []
