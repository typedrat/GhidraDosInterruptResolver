- entry_type: INT
  id: b-5F00
  category: b
  title: HP 95LX/100LX/200LX GRAPHICS PRIMITIVES - SET VIDEO MODE
  source: INTERRUP.O:902
  interrupt: 5F
  flags: []
  function: '00'
  input_registers:
  - reg: AH
    operator: '='
    value: 00h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: video mode
    table_refs: []
    sub_values:
    - value: 03h
      description: text,CGA color (100LX/200LX)
      sub_values: []
    - value: 06h
      description: 640x200 CGA graphics (100LX/200LX)
      sub_values: []
    - value: 07h
      description: text, system manager compliant
      sub_values: []
    - value: 20h
      description: 240x128 mono graphics, system manager compliant
      sub_values: []
    - value: 87h
      description: text, not system manager compliant
      sub_values: []
    - value: A0h
      description: 240x128 mono graphics, not system manager compliant
      sub_values: []
  returns: []
  notes:
  - 'the defaults after setting the mode to graphics are (0,0) logical

    origin, full-screen clip region, (0,0) pen location, pen color 1,

    pixel replacement FORCE, line type and fill mask all bits set

    modes 03h and 06h can also be set with the standard INT 10/AH=00h'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: 0F
    params: {}
    name: HP 95LX
  - type: interrupt
    interrupt: '10'
    params:
      AH: 00h
  - type: interrupt
    interrupt: '15'
    params:
      AX: 4DD4h
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: b-5F01
  category: b
  title: HP 95LX/100LX/200LX GRAPHICS PRIMITIVES - SET FILL MASK
  source: INTERRUP.O:917
  interrupt: 5F
  flags: []
  function: '01'
  input_registers:
  - reg: AH
    operator: '='
    value: 01h
    table_refs: []
    sub_values: []
  - reg: ES:DI
    operator: ->
    description: 8-byte fill mask
    table_refs: []
    sub_values: []
  returns: []
  notes:
  - 'the fill mask represents an 8x8 pixel box and is repeated as necessary

    when drawing filled rectangles; it is always aligned with the byte

    boundaries of video memory, regardless of the actual boundaries of

    the rectangle'
