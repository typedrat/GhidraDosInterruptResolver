- entry_type: INT
  id: N-60
  category: N
  title: TCPDRV 2.01 - TCP/IP Application Binary Interface (ABI)
  source: INTERRUP.O:1436
  interrupt: '60'
  flags: []
  input_registers: []
  returns: []
  notes:
  - 'The handler for the interrupt will start with a 2-byte NEAR jump

    instruction, followed by the ASCIZ signature string "TCP DRVR".

    To find the interrupt being used by the driver, an application

    should scan through interrupt vectors 60h to 7Fh until it finds

    one with the "TCP DRVR" string.

    This specification is being proposed by Peter R. Tattam from the

    University of Tasmania.'
  bugs: []
  see_also: []
  index:
  - installation check;TCPDRV
  tables: []
  table_refs: []
- entry_type: INT
  id: G-60
  category: G
  title: INTRSPY/CMDSPY v1.0 only - API
  source: INTERRUP.O:1446
  interrupt: '60'
  flags:
  - U
  input_registers: []
  returns: []
  program: 'INTRSPY is a script-driven debugger included with the book

    _Undocumented_DOS_.'
  notes:
  - 'INTRSPY will hook the first available interrupt in the range 60h-67h.

    If INTRSPY is installed, the DWORD immediately after the IRET stores

    its entry point (see #03275)

    INTRSPY v2.0 (included with the second edition of the book) no longer

    supports this API'
  bugs: []
  see_also: []
  install_check: 'determine that a) the handler is an IRET instruction, and

    b) the signature 0Dh "INTRSPY vN.NN" immediately precedes the handler'
  index:
  - installation check;INTRSPY
  tables:
  - '03275'
  table_refs:
  - '03275'
