- entry_type: INT
  id: d-60
  category: d
  title: Adaptec and OMTI controllers - DRIVE 0 DATA
  source: INTERRUP.O:1084
  interrupt: '60'
  flags: []
  input_registers: []
  returns: []
  notes:
  - 'this vector stores the first four bytes of the parameter table for

    hard disk 0

    these vectors are used by the following Adaptec controllers:

    ACB 2370 A/B/C, ACB 2372 A/B/C, ACB 2333 A/B, 2322B-8, 2322B-16

    these vectors are NOT used by the following Adaptec controllers:

    ACB 2310, ACB 2312, ACB 2320D, ACB 2322D'
  bugs: []
