- entry_type: INT
  id: N-61
  category: N
  title: FTP Software PC/TCP - TCP/IP TSR System Call interface
  source: INTERRUP.O:4491
  interrupt: '61'
  flags: []
  input_registers:
  - reg: AH
    operator: '='
    description: system call number (also see entries below)
    table_refs: []
    sub_values:
    - value: 01h
      description: '"pkt_alloc" (v2.05; this is "net_config" in v2.1+)'
      sub_values: []
    - value: 02h
      description: '"pkt_free" (v2.05; this is "get_kernel_info" in v2.1+)'
      sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers: []
    raw_lines: []
  - condition: CF set
    condition_description: on error
    registers:
    - reg: AL
      operator: '='
      description: 'basic error (see #03319)'
      table_refs:
      - 03319
      sub_values: []
    - reg: AH
      operator: '='
      description: 'suberror number (see #03320,#03321)'
      table_refs:
      - '03320'
      - '03321'
      sub_values: []
    raw_lines: []
  notes: []
  bugs:
  - "the SLIP kernel for v2.05 bounds-checks the wrong register, so values\ngreater than 54h in AH may crash the system.\t\
    Other kernels may have\nthis bug as well."
  see_also:
  - type: interrupt
    interrupt: '61'
    params:
      AH: 00h
    name: PC/TCP
  - type: interrupt
    interrupt: '61'
    params:
      AH: 2Ah
  - type: interrupt
    interrupt: '61'
    params:
      AH: 54h
  install_check: 'test for the signature "TCPTSR" three bytes beyond the start

    of the interrupt handler'
  range: INT 20h to INT E0h, selected by configuration
  index:
  - installation check;PC/TCP
  tables:
  - 03319
  - '03320'
  - '03321'
  table_refs: []
