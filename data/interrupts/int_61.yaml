- entry_type: INT
  id: N-610001DS0001
  category: N
  title: Banyan VINES - INTERNAL VINES SOCKET API (NEAR DATA)
  source: INTERRUP.O:4673
  interrupt: '61'
  flags: []
  function: 0001DS0001
  input_registers:
  - reg: AX
    operator: '='
    value: 0001h
    table_refs: []
    sub_values: []
  - reg: DS
    operator: '='
    value: 0001h
    description: (to distinguish from alternate AX=0001h socket interface)
    table_refs: []
    sub_values: []
  - reg: CX:BX
    operator: ->
    description: 'internal communications control block (see #03324)'
    table_refs:
    - '03324'
    sub_values: []
  - reg: DX
    operator: '='
    description: caller's data segment
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      description: status
      table_refs: []
      sub_values: []
    raw_lines: []
  description: StreetTalk access with session handles
  notes:
  - 'This service is handled by the adapter driver

    The request dispatch table contains dummy entries for subfunctions

    06h, 0Dh, 0Eh, 0Fh, 10h, and 11h, which always return error 0099h

    (invalid operation) in the request block''s result buffer

    in recent VINES releases, this interface is superseded by the AX=000Fh

    interface, which allows FAR parameter block pointers (refer to that

    function''s entries for more details on individual subfunctions)

    some adapter drivers (e.g. the NDIS2 token ring driver NDTOKBAN for

    VINES 5.53) ignore the value in CX and use the value from DX instead'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AX: 000Fh
  range: INT 60 to INT 66
  index: []
  tables:
  - '03324'
  table_refs: []
