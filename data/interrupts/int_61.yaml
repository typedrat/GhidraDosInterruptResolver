    operator: ->
    description: 'request block (see #03444)'
    table_refs:
    - '03444'
    sub_values: []
  - reg: DX
    operator: '='
    description: application's data segment (should be = CX)
    table_refs: []
    sub_values: []
  - reg: ES
    operator: '='
    description: DS
    table_refs: []
    sub_values: []
