  title: BW-NFS - BWRPC - ???
  source: INTERRUP.P:3956
  interrupt: '64'
  flags:
  - U
  function: '01'
  input_registers:
  - reg: AH
    operator: '='
    value: 01h
    table_refs: []
    sub_values: []
  - reg: ES:BX
    operator: ->
    description: ??? (at least 8 bytes)
    table_refs: []
    sub_values: []
  - reg: ES:BP
    operator: ->
    description: DWORD ???
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers: []
    raw_lines:
    - ???
  - condition: CF set
    condition_description: on error
    registers:
    - reg: CX
      operator: '='
      value: 0000h
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'the Beame&Whiteside TCP/IP protocol stack uses two consecutive

    interrupts (62h and 63h by default); the BW-NFS client uses a third

    consecutive interrupt (64h by default) if it is loaded

    the BWRPC installation check consists of determining the interrupt

    vector assigned to it (two more than the value returned by reading

    the ETHDEV27 device), and testing whether the word immediately

    preceding the interrupt handler is 4257h (''BW'')'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '62'
    params:
      AH: 00h
    name: ETHDEV
  - type: interrupt
    interrupt: '63'
    params:
      AH: 03h
    name: BW-TCP
  - type: interrupt
    interrupt: '63'
    params:
      AH: 24h
  range: INT 4E to INT FD, selected by configuration
  index:
  - installation checks;BWRPC
