  title: Newkey v5.4 - INSTALLATION VECTOR
  source: INTERRUP.P:4446
  interrupt: '66'
  flags: []
  input_registers: []
  returns:
  - registers: []
    raw_lines:
    - immediately (IRET)
  program: Newkey is a shareware keyboard macro program by Frank A. Bell
  notes: []
  bugs:
  - 'the code obviously intends to use INT F0-FE, INT 70-77, and INT 68-6F

    before falling back to INT 60-67, but only uses the last of these

    ranges in v5.4'
  see_also:
  - type: interrupt
    interrupt: 2F
    params:
      AX: E300h
  install_check: 'test for the signature bytes FDh FCh FFh FEh at offset 03h in

    the interrupt handlers segment'
  range: INT 60h to INT 67h, selected by scanning for highest unused vector
  index:
  - installation checks;Newkey|Newkey;installation check
