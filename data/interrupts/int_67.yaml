      table_refs: []
      sub_values: []
    - reg: BX
      operator: '='
      description: current trapping state (function 02h)
      table_refs: []
      sub_values: []
    - reg: CX
      operator: '='
      description: interrupt used as trap interrupt (functions 00h and 02h)
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'RM386 traps this function on the initial transition to protected

    mode caused by the INT instruction, which means it can not be

    overridden simply by hooking the interrupt

