- entry_type: INT
  id: E-67DE0C
  category: E
  title: Virtual Control Program Interface - SWITCH TO PROTECTED MODE
  source: INTERRUP.P:7510
  interrupt: '67'
  flags: []
  function: DE0C
  input_registers:
  - reg: AX
    operator: '='
    value: DE0Ch
    table_refs: []
    sub_values: []
  - reg: ESI
    operator: '='
    description: linear address in first megabyte of values for system
    table_refs: []
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - interrupts disabled
    - GDTR, IDTR, LDTR, TR loaded
    - SS:ESP must have at least 16 bytes space, and the entry point is
    - required to set up a new stack before enabling interrupts
    - EAX, ESI, DS, ES, FS, GS destroyed
  notes:
  - 'in protected mode, calling the protected-mode VCPI entry point with

    AX = DE0Ch

    DS = segment selector mapping entire linear address space obtained

    via AX=DE01h

    SS:ESP in first megabyte of linear memory

    STACK:QWORD  return address from FAR call to 32-bit segment

    DWORD  EIP

    DWORD  CS

    DWORD  reserved for EFLAGS

    DWORD  ESP

    DWORD  SS

    DWORD  ES

    DWORD  DS

    DWORD  FS

    DWORD  GS

    and interrupts disabled, will switch to virtual86 mode with

    interrupts disabled, all segment registers loaded, and EAX

    destroyed.'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AH: 3Fh
  - type: interrupt
    interrupt: '15'
