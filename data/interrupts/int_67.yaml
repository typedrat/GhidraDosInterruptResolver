  returns:
  - registers:
    - reg: AH
      operator: '='
      value: 00h
      description: if VIDEMS is installed
      table_refs: []
      sub_values: []
    - reg: CH
      operator: '='
      value: 00h
      description: if optimization for 80286 is used, 01h otherwise
      table_refs: []
      sub_values: []
    - reg: CL
      operator: '='
      description: internal revision number (typically 00h to 03h)
      table_refs: []
      sub_values: []
    - reg: DX
      operator: '='
      description: driver version (DH=major, DL=minor; not a BCD!)
      table_refs: []
      sub_values: []
