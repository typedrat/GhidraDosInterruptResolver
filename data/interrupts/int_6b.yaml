- entry_type: INT
  id: S-6B0000
  category: S
  title: Novell NASI/NACS, Ungermann-Bass Net One SERIAL I/O - BUFFERED WRITE
  source: INTERRUP.Q:21
  interrupt: 6B
  flags: []
  function: '0000'
  input_registers:
  - reg: AX
    operator: '='
    value: 0000h
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: length
    table_refs: []
    sub_values: []
  - reg: ES:BX
    operator: ->
    description: buffer
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: CX
      operator: '='
      description: number of bytes written
      table_refs: []
      sub_values: []
    raw_lines: []
  program: 'NASI is Novell''s NetWare Asynchronous Services Interface (purchased

    from Network Products Corp, who call it NCSI) which runs on

    workstations; NACS is the NetWare Asynchronous Communications

    Services module which runs on servers'
  notes:
  - 'this function is also supported by TelAPI, NPC NCSI, and Connection

    Manager CLIENT.EXE; for TelAPI, nonzero values in AL specify a

    connection ID

    Connection Manager returns CF set/AL=FFh if called while an INT 6B

    call is already in progress'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AX: 0100h
  - type: interrupt
    params:
      AH: 18h
  - type: interrupt
    interrupt: '14'
    params:
      AH: 19h
  - type: interrupt
    interrupt: '14'
    params:
      AH: E3h
  install_check: 'test for the signature string "NCSI" three bytes past the

    interrupt handler; see also AH=02h.

    As of version 3.0, Novell''s NASI can be distinguished from NPC''s

    NCSI by the presence of an ''A'' immediately following the signature'
  index: []
  tables: []
  table_refs: []
