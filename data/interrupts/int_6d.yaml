- entry_type: INT
  id: V-6D
  category: V
  title: VIDEO - many VGA - VIDEO BIOS ENTRY POINT
  source: INTERRUP.Q:329
  interrupt: 6D
  flags: []
  input_registers: []
  returns: []
  description: points at the original INT 10 entry point set up by the VGA BIOS
  notes:
  - 'used by IBM, ATI VGA Wonder, Paradise, Video7, and NCR, and many others

    the Diamond Stealth64 BIOS uses this vector to store the INT 42 vector

    of the inactive video (see INT 10/AH=12h/BL=35h)'
  bugs: []
