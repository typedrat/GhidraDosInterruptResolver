- entry_type: INT
  id: b-6F00
  category: b
  title: HP Vectra EX-BIOS - "F_ISR" (internal) - RESPOND TO LOGICAL ISR
  source: INTERRUP.Q:694
  interrupt: 6F
  flags: []
  function: '00'
  input_registers:
  - reg: AH
    operator: '='
    value: 00h
    table_refs: []
    sub_values: []
  - reg: BP
    operator: '='
    description: 'ID for driver (see #03741)'
    table_refs:
    - '03741'
    sub_values: []
  - reg: DH
    operator: '='
    description: 'data type (see #03742)'
    table_refs:
    - '03742'
    sub_values: []
  - reg: DL
    operator: '='
    description: physical device driver's index (driver ID / 6)
    table_refs: []
    sub_values: []
  - reg: BH
    operator: '='
    description: 'keyboard state (only if bit 5 of DH set) (see #03743)'
    table_refs:
    - '03743'
    sub_values: []
  - reg: BL
    operator: '='
    description: scancode (if bit 4 of DH clear)
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: number of scancodes in list (if bit 4 of DH set)
    table_refs: []
    sub_values: []
  - reg: ES:SI
    operator: ->
    description: scancode list (if bit 4 of DH set)
    table_refs: []
    sub_values: []
  - reg: BX
    operator: '='
    description: new X position (abs device) or X increment (relative device)
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: new Y position (abs device) or Y increment (relative device)
    table_refs: []
    sub_values: []
  - reg: BL
    operator: '='
    description: button information
    table_refs: []
    sub_values: []
  - reg: BH
    operator: '='
    description: reserved
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AH
      operator: '='
      description: 'status (see #03744)'
      table_refs:
      - '03744'
      sub_values: []
    raw_lines: []
  - condition: device is keyboard translator---
    registers:
    - reg: BL
      operator: '='
      description: translated scancode
      table_refs: []
      sub_values: []
    - reg: BH
      operator: '='
      description: 'new keyboard state (if DH bit 5 set) (see #03743)'
      table_refs:
      - '03743'
      sub_values: []
    - reg: DH
      operator: '='
      description: 'new scancode type (see #03742)'
      table_refs:
      - '03742'
      sub_values: []
    raw_lines: []
  notes:
  - 'INT 6F corresponds to IRQ23 on the original HP Vectra AT, which is

    unavailable because of its use as a BIOS extension software interrupt

    the INT 6F handler consists of an instruction to load DS with the

    driver''s data segment followed by an indexed far jump using BP to

    select the destination vector; since the interrupt handler is

    located immediately following the dispatch table, the HP_VECTOR_TABLE

    may be found by looking at offset 0000h in the INT 6F segment, and

    its size is equal to the offset of the interrupt handler

    each entry in the HP_VECTOR table consists of a DWORD for the driver''s

    entry point address and a WORD for the driver''s data segment

    this function is not user-callable, as it is a response to a physical

    event, and assumes that the caller has already handled the physical

    interrupt and updated the Describe Record (see #03749) to reflect

    the event'
  bugs: []
  see_also:
