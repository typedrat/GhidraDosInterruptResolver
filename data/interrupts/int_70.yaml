- entry_type: INT
  id: v-70
  category: v
  title: VIRUS - "Stupid" - ORIGINAL INT 21h VECTOR
  source: INTERRUP.Q:2993
  interrupt: '70'
  flags: []
  input_registers: []
  returns: []
  notes:
  - 'the virus sets this interrupt to be the same as INT 21, and then

    performs only INT 70 calls; since INT 70 is also generated by the

    real-time clock on the PC/AT and higher, this could cause random

    actions on an infected system'
