- entry_type: INT
  id: E-78
  category: E
  title: UofSalford DBOS DOS extender - API
  source: INTERRUP.Q:3073
  interrupt: '78'
  flags: []
  input_registers:
  - reg: AH
    operator: '='
    description: function
    table_refs: []
    sub_values:
    - value: 00h
      description: (PB) display 32-bit memory specified by command argument
      sub_values: []
    - value: 01h
      description: (PT) display 32-bit instruction(s) specified by command arg
      sub_values: []
    - value: 02h
      description: specify offset to subsequent PB and PT commands
      sub_values: []
    - value: 03h
      description: "switch to protected mode DWORD following INT instruction point to map; protected-mode entry point is immediately\
        \ following the DWORD Return: never Note:\tif bit 31 of the map address is set, only a stub was loaded by DOS and\
        \ DBOS will load the entire program"
      sub_values: []
    - value: 04h
      description: specify that subsequent load (AH=03h) should leave program in
      sub_values: []
    - value: 05h
      description: release program from memory
      sub_values: []
    - value: 06h
      description: set break point at address and option count from commandline
      sub_values: []
    - value: 07h
      description: resume program execution
      sub_values: []
    - value: 08h
      description: single-step program
      sub_values: []
    - value: 09h
      description: set read/write breakpoint using 386 debug registers
      sub_values: []
    - value: 0Ah
      description: set write breakpoint using 386 debug register
      sub_values: []
    - value: 0Bh
      description: set memory byte to new value
      sub_values: []
    - value: 0Ch
      description: display CPU registers
      sub_values: []
    - value: 0Dh
      description: run until specified program address reached
      sub_values: []
    - value: 0Fh
      description: print trace from program map
      sub_values: []
    - value: 10h
      description: specify an offset using a map symbol
      sub_values: []
    - value: 14h
      description: print memory without any offset
      sub_values: []
    - value: 18h
      description: switch DBOS into/out of test mode (ON/OFF commandline args)
      sub_values: []
    - value: 1Dh
      description: 'get address of real/protected-mode communication buffer Return: ES:BP -> comm buffer'
      sub_values: []
    - value: 1Eh
      description: set real-mode memory size (specify how much real-mode memory
      sub_values: []
    - value: 22h
      description: uninstall DBOS
      sub_values: []
    - value: 24h
      description: force DBOS to emulate coprocessor instructions
      sub_values: []
    - value: 26h
      description: set named DBOS switches from commandline
      sub_values: []
    - value: 27h
      description: reset named DBOS switched from commandline
      sub_values: []
    - value: 2Ah
      description: set list of dynamic link libraries to contents of commandline
      sub_values: []
    - value: 35h
      description: specify that subsequent load (AH=03h) should stop at first
      sub_values: []
  returns:
  - registers: []
    raw_lines:
    - ???
  notes:
  - 'DBOS supports functions 00h through 50h; many of these functions

    provide a low-level debugging interface

    command arguments are read from the calling program''s PSP'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '79'
    params: {}
    name: DBOS
  index:
  - uninstall;DBOS DOS extender
  tables: []
  table_refs: []
