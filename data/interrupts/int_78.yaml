  source: INTERRUP.Q:3118
  interrupt: '78'
  flags: []
  input_registers: []
  returns: []
  program: 'GO32.EXE is a DOS extender included as part of the 80386 port of the

    GNU C/C++ compiler by DJ Delorie and distributed as DJGPP'
