- entry_type: INT
  id: V-79
  category: V
  title: AVATAR.SYS - FAST GET KEYSTROKE
  source: INTERRUP.Q:3587
  interrupt: '79'
  flags: []
  input_registers: []
  returns:
  - condition: CF set
    condition_description: if no keystroke available
    registers:
    - reg: AX
      operator: '='
      value: FFFFh
      table_refs: []
      sub_values: []
    raw_lines: []
  - condition: CF clear
    condition_description: if key pressed
    registers:
    - reg: AX
      operator: '='
      description: keystroke
      table_refs: []
      sub_values: []
    raw_lines: []
  program: 'AVATAR.SYS is a CON driver by George Adam Stanislav which interprets

    AVATAR command codes just as ANSI.SYS interprets ANSI commands'
  notes:
  - 'if a keystroke is available, it is removed from the keyboard buffer

    before being returned'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '29'
    params: {}
  - type: interrupt
    interrupt: 2F
    params:
      AX: 1A00h
      BX: 4156h
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: E-79
  category: E
  title: DJGPP GO32.EXE DOS EXTENDER - RELOCATED IRQ1
  source: INTERRUP.Q:3598
  interrupt: '79'
  flags: []
  input_registers: []
  returns: []
  notes:
  - 'this vector is overwritten when GO32 starts but is not restored by

    early versions of the extender

    the newest versions of GO32 dynamically allocate the vectors used

    for the relocated IRQs, much as DESQview does (see INT 50"DESQview")'
