- entry_type: INT
  id: N-7ABX0000
  category: N
  title: Novell NetWare - IPX Driver - OPEN SOCKET
  source: INTERRUP.Q:3682
  interrupt: 7A
  flags: []
  function: BX0000
  input_registers:
  - reg: BX
    operator: '='
    value: 0000h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: socket longevity
    table_refs: []
    sub_values:
    - value: 00h
      description: open until close or terminate
      sub_values: []
    - value: FFh
      description: open until close
      sub_values: []
  - reg: DX
    operator: '='
    description: socket number (high byte in DL)
    table_refs: []
    sub_values:
    - value: 0000h
      description: 'dynamic allocation else  socket to open (see #03809)'
      sub_values: []
  returns:
  - registers:
    - reg: AL
      operator: '='
      description: return code
      table_refs: []
      sub_values: []
    - reg: DX
      operator: '='
      description: socket number
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'TSRs which need to use sockets should set AL to FFh, non-resident

    programs should normally use AL=00h

    IPX can be configured to support up to 150 open sockets on a

    workstation, and defaults to 20

    this function is supported by Advanced NetWare 1.02+'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: 7A
    params:
      BX: 0001h
  - type: interrupt
    interrupt: 7A
    params:
      BX: 0004h
  - type: interrupt
    interrupt: 7A
    params:
      BX: 0023h
  index: []
  tables:
  - 03809
  table_refs: []
- entry_type: INT
  id: N-7ABX0001
  category: N
  title: Novell NetWare - IPX Driver - CLOSE SOCKET
  source: INTERRUP.Q:3729
  interrupt: 7A
  flags: []
  function: BX0001
  input_registers:
  - reg: BX
    operator: '='
    value: 0001h
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    description: 'socket number (high byte in DL) (see #03809)'
    table_refs:
    - 03809
    sub_values: []
  returns: []
  notes:
  - 'also cancels events set by any Event Control Blocks for the socket

    the program must close all open sockets before terminating

    this function is supported by Advanced NetWare 1.02+

    When the NetWare-specific release of the DR DOS command processor does

    a NetWare shutdown sequence on exit, it will close all user sockets

    except for socket numbers 4000 and 4001, which seem to be used by IPX

    internally.'
  bugs: []
  see_also:
  - type: interrupt
    params:
      BX: 0000h
  index: []
  tables: []
