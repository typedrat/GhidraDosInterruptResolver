- entry_type: INT
  id: N-7ABX0002
  category: N
  title: Novell NetWare - IPX Driver - GET LOCAL TARGET
  source: INTERRUP.Q:3741
  interrupt: 7A
  flags: []
  function: BX0002
  input_registers:
  - reg: BX
    operator: '='
    value: 0002h
    table_refs: []
    sub_values: []
  - reg: ES:SI
    operator: ->
    description: 'target internetwork address (see #03824 at INT 7A/BX=000Bh)'
    table_refs:
    - 03824
    sub_values: []
  - reg: ES:DI
    operator: ->
    description: 6-byte buffer for local target
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AL
      operator: '='
      description: return code
      table_refs: []
      sub_values: []
    - reg: CX
      operator: '='
      description: expected one-way transfer time (clock ticks) for a 576-byte
      table_refs: []
      sub_values: []
    - reg: ES:DI
      operator: ->
      description: local target
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'the internetwork address consists of a 4-byte network address followed

    by a 6-byte node address.  The local target is only a 6-byte node

    address.  If the target is in the same network, the local target is

    just the node address of target; otherwise, the local target is the

    node address of the bridge that leads to the target.

    this function may be called from inside IPX and AES Event Service

    Routines, but not from other interrupt handlers

    this function is supported by Advanced NetWare 1.02+'
  bugs: []
  see_also:
  - type: interrupt
    params:
      BX: 0009h
  index: []
  tables: []
  table_refs: []
