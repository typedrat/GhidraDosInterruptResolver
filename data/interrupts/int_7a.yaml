- entry_type: INT
  id: N-7A
  category: N
  title: Novell NetWare - LOW-LEVEL API - Notes
  source: INTERRUP.Q:3671
  interrupt: 7A
  flags: []
  input_registers: []
  returns: []
  notes:
  - "this interrupt is used for IPX/SPX access in NetWare versions through\n2.0a; in later versions, you should use INT 2F/AX=7A00h\
    \ to get an\nentry point even though INT 7A still exists.\tFor both INT 7A and\nthe FAR entry point, BX contains the function\
    \ number; IPX is\nsometimes called internally with BX bit 15 set, which causes the\nhandler to bypass some initial checks\
    \ and an optional call to the\nIPX Windows support handler set with INT 2F/AX=7AFFh/BX=0000h\n(see #02926)"
  bugs: []
  see_also:
  - type: interrupt
    interrupt: 2F
    params:
      AX: 7A00h
