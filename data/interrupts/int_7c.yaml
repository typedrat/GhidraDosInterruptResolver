- entry_type: INT
  id: N-7C0006
  category: N
  title: SK-UPPS Data Link Interface API - TRANSMIT FRAME
  source: INTERRUP.Q:5295
  interrupt: 7C
  flags: []
  function: '0006'
  input_registers:
  - reg: AX
    operator: '='
    value: 0006h
    table_refs: []
    sub_values: []
  - reg: ES:BX
    operator: ->
    description: 'Mbuf (see #03847)'
    table_refs:
    - 03847
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - nothing
  notes:
  - 'The DLI will send LENGTH bytes found in the Mbuf''s DATA area starting

    at OFFSET. A complete and valid frame must be stored there. The DLI

    will only copy the current node address (see AX=0003h) to the

    source node field of the frame''s MAC header.

    On Ethernet, the DLI will always send a minimum of 60 bytes, regardless

    of the value found in the LENGTH field.

    This function returns immediately; the DLI will call the protocol''s

    Transmit Upcall (see #03848) when the frame has been sent.

    The Mbuf''s IN USE field will be non-zero until the DLI calls the

    Transmit Upcall.'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AX: 0002h
  - type: interrupt
    params:
      AX: 0004h
  - type: interrupt
    params:
      AX: 0013h
  index: []
  tables:
  - 03848
  table_refs:
