    operator: '='
    description: 'subfunction; bits 14-15 specify direction of I/O:'
    table_refs: []
    sub_values:
    - value: '00'
      description: no data at all (ES:BX undefined)
      sub_values: []
    - value: '01'
      description: driver -> application (GET)
      sub_values: []
    - value: '10'
      description: application -> driver (SET)
      sub_values: []
    - value: '11'
      description: both directions (GET/SET)
      sub_values: []
