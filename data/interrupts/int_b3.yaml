- entry_type: INT
  id: U-B370
  category: U
  title: ZIPKEY - GET VERSION
  source: INTERRUP.R:781
  interrupt: B3
  flags: []
  function: '70'
  input_registers:
  - reg: AH
    operator: '='
    value: 70h
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AH
      operator: '='
      description: major version
      table_refs: []
      sub_values: []
    - reg: AL
      operator: '='
      description: minor version
      table_refs: []
      sub_values: []
    - reg: CL
      operator: '='
      description: number of states and territories in current database
      table_refs: []
      sub_values: []
    - reg: DH
      operator: '='
      description: year of current database - 1900
      table_refs: []
      sub_values: []
    - reg: DL
      operator: '='
      description: month of current database's file date
      table_refs: []
      sub_values: []
    raw_lines: []
  program: ZIPKEY is a resident ZIPCODE database by Eric Isaacson
  notes:
  - 'if installed, the string "ZIPKEY" is present at offset 75h in the

    interrupt handler''s segment, and the byte at 7Bh contains the API

    version number (00h for v1.x, 01h for v2.0)'
