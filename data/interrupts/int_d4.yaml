- entry_type: INT
  id: O-D407
  category: O
  title: PC-MOS/386 v3.0+ - WAIT FOR EVENT
  source: INTERRUP.R:1566
  interrupt: D4
  flags: []
  function: '07'
  input_registers:
  - reg: AH
    operator: '='
    value: 07h
    table_refs: []
    sub_values: []
  - reg: AL
    operator: '='
    description: 'events to monitor (see #04015)'
    table_refs:
    - '04015'
    sub_values: []
  - reg: BX
    operator: '='
    description: number of timer ticks until timeout if AL bit 1 set
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: bitmap of IRQs to monitor if AL bit 2 set
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    description: port to monitor if AL bit 3 set
    table_refs: []
    sub_values: []
  returns:
  - condition: CF clear
    condition_description: if successful
    registers:
    - reg: AL
      operator: '='
      description: 'type of event which woke up task (see #04015)'
      table_refs:
      - '04015'
      sub_values: []
    - reg: CX
      operator: '='
      description: IRQ (if any) which awakened task
      table_refs: []
      sub_values: []
    - reg: DX
      operator: '='
      description: port (if any) which awakened task
      table_refs: []
      sub_values: []
    raw_lines: []
  - condition: CF set
    condition_description: on error
    registers:
    - reg: AX
      operator: '='
      description: 'error code (see #01680 at INT 21/AH=59h/BX=0000h)'
      table_refs:
      - 01680
      sub_values: []
    raw_lines: []
  notes:
  - 'a device driver may make this call with AL=00h, which indicates that

    the driver is responsible for setting and clearing the TCBWAIT field

    in the TCB.  To put task to sleep, set TCBWAIT bits 2-0 to 001; to

    reawaken it, set bit 1 (leaving other bits unchanged)'
  bugs: []
  see_also:
