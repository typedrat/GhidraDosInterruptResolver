- entry_type: INT
  id: r-DD
  category: r
  title: STSC APL*PLUS/PC v9.0 - PLACE KEYSTROKE EVENTS IN INPUT BUFFER
  source: INTERRUP.R:1981
  interrupt: DD
  flags: []
  input_registers:
  - reg: BX
    operator: '='
    description: where to place keystrokes
    table_refs: []
    sub_values:
    - value: FFFFh
      description: insert before current buffer contents
      sub_values: []
    - value: 0000h
      description: replace current contents
      sub_values: []
    - value: 0001h
      description: insert after current contents
      sub_values: []
  - reg: CX
    operator: '='
    description: number of keystroke events to insert
    table_refs: []
    sub_values: []
  - reg: ES:SI
    operator: ->
    description: data to be placed into buffer (list of WORD key codes)
    table_refs: []
    sub_values:
    - value: 4000h
      description: + N = normal ASCII keystroke N (N = 00h to FFh)
      sub_values: []
    - value: 4100h
      description: + N = extended ASCII keystroke N (N = 03h to 84h)
      sub_values: []
  returns:
  - registers: []
    raw_lines:
    - nothing
  notes: []
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '16'
    params:
      AH: 05h
