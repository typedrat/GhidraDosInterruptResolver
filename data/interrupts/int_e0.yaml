- entry_type: INT
  id: O-E0CL03
  category: O
  title: DR Multiuser DOS - "A_READ" - READ CHARACTER FROM DEFAULT AUX DEVICE
  source: INTERRUP.R:2346
  interrupt: E0
  flags: []
  function: CL03
  input_registers:
  - reg: CL
    operator: '='
    value: 03h
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AL
      operator: '='
      description: ASCII character
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'A_READ reads the next 8-bit character from the logical auxilliary

    input device (AUXn:); control is not returned to the calling

    process until a character has been read.

    if another process owns AUX, this call blocks until the device becomes

    available

    this function is also supported by REAL/32'
  bugs: []
