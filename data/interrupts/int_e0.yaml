- entry_type: INT
  id: O-E0CL06
  category: O
  title: REAL/32 - "C_RAWIO" - PERFORM RAW I/O WITH DEFAULT CONSOLE
  source: INTERRUP.R:2376
  interrupt: E0
  flags: []
  function: CL06
  input_registers:
  - reg: CL
    operator: '='
    value: 06h
    table_refs: []
    sub_values: []
  - reg: DL
    operator: '='
    description: mode describing the operation to be performed
    table_refs: []
    sub_values:
    - value: FFh
      description: get console input/status
      sub_values: []
    - value: FEh
      description: get console status
      sub_values: []
    - value: FDh
      description: get console input (blocking) else output DL to the console as a character
      sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      description: returned value
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'during raw I/O, the special characters ^C, ^O, ^P, and ^S are not

    interpreted, but are passed through

    if the virtual console is in ^S mode and the owning process calls

    this function, the ^S state is cleared'
  bugs: []
  see_also:
