- entry_type: INT
  id: O-E0
  category: O
  title: CP/M-86, Concurrent CP/M, DR Multiuser DOS - FUNCTION CALLS
  source: INTERRUP.R:2049
  interrupt: E0
  flags: []
  input_registers:
  - reg: CL
    operator: '='
    description: 'function number (see #04019,#04020)'
    table_refs:
    - 04019
    - '04020'
    sub_values: []
  - reg: DL
    operator: '='
    description: byte parameter
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    description: word parameter
    table_refs: []
    sub_values: []
  - reg: DS:DX
    operator: ->
    description: structure
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AL
      operator: '='
      description: byte result
      table_refs: []
      sub_values: []
    - reg: AX
      operator: '='
      description: word
      table_refs: []
      sub_values: []
    - reg: ES:AX
      operator: ->
      description: structure (and BX=ES)
      table_refs: []
      sub_values: []
    raw_lines:
    - 'as appropriate for function:'
  notes:
  - 'several functions are covered in more detail in following entries

    most of these calls are also supported by Digital Research''s DOS Plus

    v2.1; the unsupported functions are 26h,29h-2Bh,3Ah,3Dh-62h,71h-8Ch,

    90h-92h,94h-97h,9Bh-ABh, and AEh-FFh'
