- entry_type: INT
  id: O-E0CL00
  category: O
  title: REAL/32 - "P_TERMCPM" - TERMINATE CALLING PROCESS
  source: INTERRUP.R:2309
  interrupt: E0
  flags: []
  function: CL00
  input_registers:
  - reg: CL
    operator: '='
    value: 00h
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      description: error code
      table_refs: []
      sub_values: []
    raw_lines: []
  program: 'REAL/32 is the descendant of IMS Multiuser DOS, which in turn is

    derived from DR Multiuser DOS and its predecessors (Concurrent DOS,

    etc.)'
  notes:
  - 'sets the exit code (ERRORLEVEL) to 00h

    INT E0h is officially reserved for Digital Research by Intel.

    Apparently some Borland products also used this interrupt, which forced

    Digital Research to indirect calls through other interrupt entry

    points.

    This is also supported by IMS Multiuser DOS and IMS REAL/32.'
  bugs: []
  see_also:
  - type: interrupt
    interrupt: '21'
    params:
      AH: 00h
  index: []
  tables: []
  table_refs: []
- entry_type: INT
  id: O-E0CL01
  category: O
  title: REAL/32 - "C_READ" - FETCH CHARACTER FROM THE DEFAULT CONSOLE
  source: INTERRUP.R:2325
  interrupt: E0
  flags: []
  function: CL01
  input_registers:
  - reg: CL
    operator: '='
    value: 01h
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      description: character
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'this function echos the character to the screen, expanding Tab

    characters to the next multiple of eight columns; Ctrl-C is

    ignored if the calling process can not terminate

    the calling process is suspended until a character is available; if

    the caller does not own the console, it is suspended until it

    can attach to the console'
  bugs: []
  see_also:
