- entry_type: INT
  id: O-E1
  category: O
  title: MP/M-86, - ALTERNATE CP/M-86 FUNCTION CALLS
  source: INTERRUP.R:3997
  interrupt: E1
  flags: []
  input_registers:
  - reg: CL
    operator: '='
    description: 'function number (see #04019,#04020)'
    table_refs:
    - 04019
    - '04020'
    sub_values: []
  returns:
  - registers: []
    raw_lines:
    - as appropriate for function
    - 'CX is often the error code (see #04021)'
  description: 'used by some applications which alter CP/M functions while running a

    child program, to store the original INT E0 vector before

    intercepting INT E0'
  notes:
  - 'This is the debugger entry to the operating system.

    This function is also supported by IMS Multiuser DOS and IMS REAL/32.'
