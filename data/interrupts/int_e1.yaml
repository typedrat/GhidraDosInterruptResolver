- entry_type: INT
  id: --E1
  title: DeskMate (Tandy) - TASK DATA SEGMENTS (NOT A VECTOR!)
  source: INTERRUP.R:4009
  interrupt: E1
  flags: []
  input_registers: []
  returns: []
  description: "used to store data; the\tlow word of the vector is the data segment for\nthe first task; the high word is\
    \ the data segment of the second task\n(DeskMate supports 2-way task switching between small- or\nmedium-model applications)"
  program: 'DeskMate is a proprietary GUI from Tandy distributed with several

    models of the Tandy 1000''s, 2500''s, 3000''s, and laptops.  Retail

    and runtime versions also exist.  Some Tandy''s are designed to

    boot directly into DeskMate.'
