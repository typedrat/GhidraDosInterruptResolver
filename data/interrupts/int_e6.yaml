- entry_type: INT
  id: O-E6
  category: O
  title: CP/M-86 v1.1 - XIOS INTERRUPT / UNKNOWN DISK DRIVE
  source: INTERRUP.R:4064
  interrupt: E6
  flags:
  - C
  input_registers:
  - reg: AX
    operator: '='
    description: function which accessed drive
    table_refs: []
    sub_values:
    - value: 0000h
      description: SELDSK
      sub_values: []
    - value: 0001h
      description: READ
      sub_values: []
    - value: 0002h
      description: WRITE
      sub_values: []
    - value: 0003h
      description: HOME
      sub_values: []
  - reg: DX:BX
    operator: ->
    description: 'parameter block (see #04063)'
    table_refs:
    - '04063'
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      description: return value
      table_refs: []
      sub_values: []
    raw_lines: []
  description: 'called by CP/M-86 kernel when an unknown disk drive is used, which

    permits an application to provide access services'
  notes:
  - 'This was labelled "XIOS interrupt" in later Digital Research

    documentation (CCP/M-86) and "for the version 1.0 back door".'
  bugs: []
  see_also: []
  index: []
  tables:
  - '04063'
  table_refs: []
- entry_type: INT
  id: O-E600
  category: O
  title: Linux DOSEMU - INSTALLATION CHECK
  source: INTERRUP.R:4089
  interrupt: E6
  flags: []
  function: '00'
  input_registers:
  - reg: AH
    operator: '='
    value: 00h
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      value: AA55h
      description: if installed
      table_refs: []
      sub_values: []
    - reg: BH
      operator: '='
      description: major version number
      table_refs: []
      sub_values: []
    - reg: BL
      operator: '='
      description: minor version number
      table_refs: []
      sub_values: []
    - reg: CX
      operator: '='
      description: patchlevel
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'check for the BIOS date string "02/25/93" at F000:FFF5 before

    calling this function.  In addition, the segment address of this

    vector should be F000h (for existing versions of DOSemu, the

    vector is F000h:0E60h)'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AH: FFh
  index: []
  tables: []
  table_refs: []
