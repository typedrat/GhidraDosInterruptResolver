- entry_type: INT
  id: --F101
  title: Common ISDN API (CAPI) v1.1 - "API-REGISTER" - INITIALIZE CAPI
  source: INTERRUP.R:4319
  interrupt: F1
  flags: []
  function: '01'
  input_registers:
  - reg: AH
    operator: '='
    value: 01h
    table_refs: []
    sub_values: []
  - reg: ES:BX
    operator: ->
    description: buffer for CAPI's use (refer to note below)
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: minimum number of pending messages
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    description: maximum simultaneous Level 3 connections
    table_refs: []
    sub_values: []
  - reg: SI
    operator: '='
    description: maximum concurrent received B3 data blocks
    table_refs: []
    sub_values: []
  - reg: DI
    operator: '='
    description: maximum B3 data block size
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      description: CAPI-assigned application ID
      table_refs: []
      sub_values: []
    - reg: BX
      operator: '='
      description: error number
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'the caller is required to provide at least 512 bytes of stack space

    the CAPI interrupt handler begins with a header which is nearly

    identical to the IBM Interrupt Sharing Protocol header

    (see #02568 at INT 2D"AMIS"), except that the short jump instruction

    to a hardware reset handler at offset 09h is replaced by the

    signature bytes "IA"

    the maximum length of a message is fixed at 180 bytes; the standard

    document suggests using CX=10, DI=1, SI=7, and DI=130 for

    applications which use only a single connection and standard

    protocols

    the total size of the application-provided buffer must be at least

    180*CX + DX*SI*DI bytes'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AH: 02h
  - type: interrupt
    interrupt: F1
    params:
      AL: 01h
  range: INT 00 to INT FF, selectable by program parameter
  index:
  - installation check;Common ISDN API
  tables: []
  table_refs:
  - 02568
- entry_type: INT
  id: --F101
  title: Common ISDN API (CAPI) v2.0 - "CAPI_REGISTER" - INITIALIZE CAPI
  source: INTERRUP.R:4346
  interrupt: F1
  flags: []
  function: '01'
  input_registers:
  - reg: AL
    operator: '='
    value: 01h
    table_refs: []
    sub_values: []
  - reg: AH
    operator: '='
    description: CAPI version number * 10 (14h for v2.0)
    table_refs: []
    sub_values: []
  - reg: ES:BX
    operator: ->
    description: buffer for CAPI's use (refer to note below)
    table_refs: []
    sub_values: []
  - reg: CX
    operator: '='
    description: number of bytes for message buffer
    table_refs: []
    sub_values: []
  - reg: DX
    operator: '='
    description: maximum simultaneous logical (Level 3) connections
    table_refs: []
    sub_values: []
  - reg: SI
    operator: '='
    description: maximum concurrent received B3 data blocks (min. 2)
    table_refs: []
    sub_values: []
  - reg: DI
    operator: '='
    description: maximum B3 data block size (up to 2048 bytes)
    table_refs: []
    sub_values: []
  returns:
  - registers:
    - reg: AX
      operator: '='
      description: CAPI-assigned application ID
      table_refs: []
      sub_values: []
    - reg: BX
      operator: '='
      description: error number
      table_refs: []
      sub_values: []
    raw_lines: []
  notes:
  - 'the caller is required to provide at least 512 bytes of stack space

    the CAPI interrupt handler begins with a header (see #04068) which is

    nearly identical to the IBM Interrupt Sharing Protocol header

    (see #02568 at INT 2D"AMIS"), except that the short jump instruction

    to a hardware reset handler at offset 09h is zeroed out and the

    entire header is inexplicably shortened by one byte

    the standard document suggests using 1024 + (1024*DX) bytes for the

    message buffer for typical applications

    the total size of the application-provided buffer must be at least

    CX + DX*SI*DI bytes'
  bugs: []
  see_also:
  - type: interrupt
    params:
      AH: 01h
  - type: interrupt
    interrupt: F1
    params:
      AL: 02h
  range: INT 00 to INT FF, selectable by program parameter
  index:
  - installation check;Common ISDN API
  tables:
  - 04068
  table_refs:
  - 02568
  - 04068
