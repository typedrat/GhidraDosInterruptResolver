- entry_type: INT
  id: T-FC
  category: T
  title: DoubleDOS - GET CURRENT SCREEN BUFFER ADDRESS
  source: INTERRUP.R:5010
  interrupt: FC
  flags: []
  input_registers: []
  returns:
  - registers:
    - reg: ES
      operator: '='
      description: segment of display buffer
      table_refs: []
      sub_values: []
    raw_lines: []
  description: 'determine the address of the virtual screen to which the program

    should write instead of the actual video memory, so that the

    multitasked programs do not interfere with each other''s output'
  notes:
  - the display buffer may be moved if multitasking is enabled
